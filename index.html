  { t: 'Ярость', u: 'stickers/rage.svg' },
  { t: 'Ракета', u: 'stickers/rocket.svg' }
];
const safeMedia = u => { const s = String(u || '').trim(); return (/^https?:\/\/\S+$/i.test(s) || /^(?:\.\/|\/)?[\w-]+\/[\w./-]+\.svg$/i.test(s)) ? s : ''; };
const mentionDropdown = (input, getNames) => {
  let box = null, active = -1;
  const close = () => { if (box) box.remove(); box = null; active = -1; };
  const pick = n => {
    const v = input.value, i = v.lastIndexOf('@');
    if (i < 0) return close();
    input.value = v.slice(0, i) + '@' + n + ' ';
    close(); input.focus();
    input.dispatchEvent(new Event('input', { bubbles: true }));
  };
  const show = q => {
    const ql = q.toLowerCase();
    const list = [...new Set(typeof getNames === 'function' ? getNames() : getNames)].filter(n => n && n.toLowerCase().includes(ql)).slice(0, 8);
    if (!list.length) return close();
    if (!box) { box = document.createElement('div'); box.className = 'mdrop'; input.parentElement.appendChild(box); }
    const paint = () => {
      box.innerHTML = list.map((n, i) => `<button class="${i === active ? 'on' : ''}" data-m="${esc(n)}">@${esc(n)}</button>`).join('');
      box.querySelectorAll('button').forEach(b => b.onclick = () => pick(b.dataset.m));
    };
    paint();
  };
  input.addEventListener('input', () => {
    const upto = input.value.slice(0, input.selectionStart);
    const m = upto.match(/@([\p{L}\p{N}_.-]{0,32})$/u);
    if (m) show(m[1]); else close();
  });
  input.addEventListener('keydown', e => {
    if (!box) return;
    const items = [...box.querySelectorAll('button')];
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); active = (active + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length;
      items.forEach((b, i) => b.classList.toggle('on', i === active));
    } else if (e.key === 'Enter' && active >= 0) { e.preventDefault(); pick(items[active].dataset.m); }
    else if (e.key === 'Escape') close();
  });
  input.addEventListener('blur', () => setTimeout(close, 160));
};
const wireTyping = (channel, input, indicator, key, onEvent) => {
  if (!indicator) return () => {};
  let last = 0, timer = null;
  const show = nick => {
    indicator.innerHTML = `<span class="dots"><i></i><i></i><i></i></span>${esc(nick)} печатает…`;
    indicator.hidden = false; clearTimeout(timer);
    timer = setTimeout(() => { indicator.hidden = true; }, 2400);
  };
  input.addEventListener('input', () => {
    const now = Date.now();
    if (now - last > 900 && channel && typeof channel.send === 'function') {
      last = now;
      try { channel.send({ type: 'broadcast', event: 'typing', payload: { nick: tacNick(), key } }).catch(() => {}); } catch (e) {}
    }
  });
  onEvent(show);
  return () => { indicator.hidden = true; clearTimeout(timer); };
};
const attachMenuCache = { initialized: false, text: '' };
const attachMenu = (host, onSend, allowTactic) => {
  if (!host) return;
  const btn = host.querySelector('.attach-btn');
  const menu = document.createElement('div'); menu.className = 'attach-menu'; menu.hidden = true; host.appendChild(menu);

          close();
        });
      });
    }
    attachMenuCache.initialized = true;
  };
  const open = () => { if (!menu.children.length) init(); else attachMenuCache.text = textBox ? textBox.value : attachMenuCache.text; menu.hidden = false; };
  btn.onclick = e => { e.stopPropagation(); menu.hidden = !menu.hidden; if (!menu.hidden) open(); };
  document.addEventListener('click', e => { if (!menu.hidden && !host.contains(e.target)) close(); });

    log.querySelectorAll('[data-dm]').forEach(b => b.onclick = () => { stopGlobalChan(); openDm(b.dataset.dm); });
    log.querySelectorAll('[data-delmsg]').forEach(b => b.onclick = () => animateDelete(b, async () => {
      const { error } = await sb.from('global_messages').delete().eq('id', b.dataset.delmsg);
      if (error) return alert(error.message);
      load();
    }));
  };
  const load = async () => {
    const r = await sb.from('global_messages').select('id,user_id,nick,avatar_url,body,created_at').order('created_at', { ascending: false }).limit(100);
    if (r.data) { chatNames = [...new Set(r.data.map(m => m.nick).filter(Boolean))]; paint(r.data.slice().reverse()); }
  };
  paint((data || []).slice().reverse());
  stopGlobalChan();
  let showTyping = () => {};
  globalChan = sb.channel('global-chat')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'global_messages' }, () => load())
    .on('broadcast', { event: 'typing' }, p => {
      const v = p.payload || {};
      if (v.nick && v.nick !== tacNick()) showTyping(v.nick);
    }).subscribe();
  showTyping = wireTyping(globalChan, document.getElementById('gmsg'), typing, 'global', fn => { showTyping = fn; });
  mentionDropdown(document.getElementById('gmsg'), () => chatNames);
  attachMenu(document.querySelector('#gattach').parentElement, sendRaw, canEdit());
  const send = async () => { sendRaw(val('gmsg').trim()); };
  async function sendRaw(t) {
    if (!t) return;
    const { error: e } = await sb.from('global_messages').insert({
      user_id: user.id, nick: tacNick(),
      avatar_url: (user.user_metadata || {}).avatar_url || null, body: t
    });
    if (e) return alert(e.message);
    notifyMentions(t, 'global');
    const inp = document.getElementById('gmsg'); if (inp) inp.value = '';
    typing.hidden = true;
    load();
  }
  document.getElementById('gsend').onclick = send;
  document.getElementById('gmsg').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
}

function setupAvatar() {
  const file = document.getElementById('s_file');
  file.onchange = async () => {
    const f = file.files[0]; if (!f) return;
    try {
      const bmp = await createImageBitmap(f);
      const cv = document.createElement('canvas'); cv.width = cv.height = 256;
      const side = Math.min(bmp.width, bmp.height);
      cv.getContext('2d').drawImage(bmp, (bmp.width - side) / 2, (bmp.height - side) / 2, side, side, 0, 0, 256, 256);
      const blob = await new Promise(r => cv.toBlob(r, 'image/webp', 0.9));
      const path = clan.id + '/avatar.' + (blob.type === 'image/webp' ? 'webp' : 'png');
      const up = await sb.storage.from('clan-avatars').upload(path, blob, { upsert: true, contentType: blob.type });
      let url;
      if (up.error && /row-level security|bucket not found|permission|403/i.test(up.error.message)) {
        // Бакета Storage нет — кладём маленькую аватарку прямо в clans.avatar_url.
        url = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result)); fr.onerror = () => rej(fr.error); fr.readAsDataURL(blob); });
      } else if (up.error) return alert(up.error.message);
      else url = sb.storage.from('clan-avatars').getPublicUrl(path).data.publicUrl + '?v=' + Date.now();
      const { error } = await sb.from('clans').update({ avatar_url: url }).eq('id', clan.id);
      if (error) return alert(error.message);
      clan.avatar_url = url; render();
    } catch (e) { alert('Не удалось загрузить картинку: ' + e.message); }
  };
  const rm = document.getElementById('s_rmav');
  if (rm) rm.onclick = async () => {
    const { error } = await sb.from('clans').update({ avatar_url: null }).eq('id', clan.id);
    if (error) return alert(error.message);
    clan.avatar_url = null; render();
  };
}

      cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);

      const path = clan.id + '/' + Date.now() + '.jpg';
      const up = await sb.storage.from('verification-proofs').upload(path, blob, { contentType: 'image/jpeg' });

        ? 'Бакет verification-proofs не настроен. Выполни supabase/storage.sql в Supabase SQL Editor — он создаст бакет и политики доступа.'
        : up.error.message);
      const { error } = await sb.rpc('request_verification', { p_cid: clan.id, p_tier: tier, p_ingame: txt('v_name'), p_proof: path, p_note: txt('v_note') });
      if (error) return alert(error.message);
      alert('Заявка отправлена');
      viewSettings();
    } catch (e) { alert('Не удалось отправить: ' + e.message); }
  };
}

    sb.from('match_stats').select('player_id,kills,deaths,assists,score,matches!inner(played_at,mode)')

    sb.from('players').select('id,nick,joined_at').eq('clan_id', clan.id).eq('active', true)
  ]);
  const err = ms.error || st.error || pl.error;
  if (err) return body.innerHTML = failBox(err);
  const keyOf = iso => {
    const d = new Date(iso);
    if (statGroup !== 'week') return d.toISOString().slice(0, 10);
    const w = new Date(d); w.setDate(w.getDate() - ((w.getDay() + 6) % 7)); return w.toISOString().slice(0, 10);
  };
  const labelOf = k => new Date(k + 'T00:00:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
  const buckets = new Map();
  const ensure = k => { if (!buckets.has(k)) buckets.set(k, { n: 0, w: 0, k: 0, d: 0, a: 0 }); return buckets.get(k); };
  const isWin = m => (m.result || '').toLowerCase().includes('побед') || m.place === 1;
  ms.data.forEach(m => { const b = ensure(keyOf(m.played_at)); b.n++; if (isWin(m)) b.w++; });
  st.data.forEach(s => { if (idleStat(s)) return; const b = ensure(keyOf(s.matches.played_at)); b.k += s.kills || 0; b.d += s.deaths || 0; b.a += s.assists || 0; });
  const keys = [...buckets.keys()].sort();
  const allN = ms.data.length, allW = ms.data.filter(isWin).length;
  const allK = st.data.reduce((a, s) => a + (s.kills || 0), 0), allD = st.data.reduce((a, s) => a + (s.deaths || 0), 0);
  const maxN = Math.max(1, ...keys.map(k => buckets.get(k).n));
  const W = Math.max(320, keys.length * 46), H = 100, step = W / Math.max(1, keys.length), bw = Math.min(14, step * 0.32);
  const every = Math.max(1, Math.ceil(keys.length / 8));
  const bars = keys.map((k, i) => {
    const b = buckets.get(k), h = Math.max(2, b.n / maxN * H), hw = Math.max(2, b.w / maxN * H);
    const x = i * step + (step - bw * 2 - 2) / 2;
    const lab = i % every === 0 ? `<text x="${x + bw}" y="${H + 14}" text-anchor="middle">${esc(labelOf(k))}</text>` : '';
    return `<g><title>${esc(labelOf(k))}: боёв ${b.n}, побед ${b.w}</title><rect x="${x}" y="${H - h}" width="${bw}" height="${h}" rx="3" fill="var(--ac)"/><rect x="${x + bw + 2}" y="${H - hw}" width="${bw}" height="${hw}" rx="3" fill="var(--ok)"/>${lab}</g>`;
  }).join('');
  const chart = keys.length ? `<svg class="chart" viewBox="0 0 ${W} ${H + 20}" preserveAspectRatio="none"><line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="var(--bd)"/>${bars}</svg><p class="mut">Фиолетовый — бои, зелёный — победы.</p>` : '<p class="mut">За период боёв нет.</p>';
  // Линия динамики: винрейт и KDA по периодам.
  const maxV = Math.max(1, ...keys.map(k => Math.max(buckets.get(k).w / Math.max(1, buckets.get(k).n) * 100,
    (buckets.get(k).k + buckets.get(k).a) / Math.max(1, buckets.get(k).d))));
  const pts = (field) => keys.map((k, i) => {
    const b = buckets.get(k);
    const v = field === 'win' ? b.w / Math.max(1, b.n) * 100 : (b.k + b.a) / Math.max(1, b.d);
    return `${(i * step + step / 2).toFixed(1)},${(H - v / maxV * H).toFixed(1)}`;
  }).join(' ');
  const trend = keys.length > 1 ? `<p class="mut" style="margin:12px 0 4px">Динамика: зелёный — винрейт, голубой — KDA</p>
    <svg class="chart" viewBox="0 0 ${W} ${H + 20}" preserveAspectRatio="none"><line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="var(--bd)"/>
    <polyline points="${pts('win')}" fill="none" stroke="var(--ok)" stroke-width="2"/>
    <polyline points="${pts('kda')}" fill="none" stroke="#38bdf8" stroke-width="2"/></svg>` : '';
  const modeRows = ['Потасовка', 'Турнир', 'Захват базы', 'Другое'].map(mode => {
    const list = ms.data.filter(m => mode === 'Другое' ? !m.mode || !['Потасовка', 'Турнир', 'Захват базы'].includes(m.mode) : m.mode === mode);
    const ids = new Set(list.map(m => m.id));
    const ss = st.data.filter(s => ids.has(s.matches && s.matches.id));
    const w = list.filter(isWin).length;
    const k = ss.reduce((a, s) => a + (s.kills || 0), 0), dd = ss.reduce((a, s) => a + (s.deaths || 0), 0), aa = ss.reduce((a, s) => a + (s.assists || 0), 0);
    return `<tr><td>${mode}</td><td>${list.length}</td><td>${w}</td><td>${list.length ? Math.round(w / list.length * 100) + '%' : '—'}</td><td>${k}</td><td>${dd}</td><td>${dd ? (k / dd).toFixed(2) : '—'}</td><td>${dd ? ((k + aa) / dd).toFixed(2) : '—'}</td></tr>`;
  }).join('');
  const modeCard = `<div class="card wrap"><h2>По режимам</h2><table><tr><th>Режим</th><th>Боёв</th><th>Побед</th><th>Винрейт</th><th>K</th><th>D</th><th>K/D</th><th>KDA</th></tr>${modeRows}</table></div>`;
  const agg = {};
  pl.data.forEach(p => agg[p.id] = { id: p.id, nick: p.nick, joined: p.joined_at, n: 0, k: 0, d: 0, ast: 0, sc: 0, tot: 0 });
  st.data.forEach(s => { const a = agg[s.player_id]; if (!a || idleStat(s)) return; a.n++; a.k += s.kills || 0; a.d += s.deaths || 0; a.ast += s.assists || 0; a.sc += s.score || 0; });
  ms.data.forEach(m => pl.data.forEach(p => { if (!p.joined_at || new Date(m.played_at) >= new Date(p.joined_at)) agg[p.id].tot++; }));
  Object.values(agg).forEach(a => { a.tot = Math.max(a.tot, a.n); });
  const vals = Object.values(agg);
  const kd = a => a.d ? a.k / a.d : (a.k || 0);
  const rows = (title, arr) => `<div class="card"><h3 style="font-size:14px;margin:0 0 8px">${title}</h3>${arr.length ? arr.map((x, i) => `<div class="prow"><b>${i + 1}.</b><span style="flex:1;min-width:0">${esc(x.name)}</span><span class="mut">${esc(x.value)}</span></div>`).join('') : '<p class="mut">Нет данных.</p>'}</div>`;
  const freshCut = Date.now() - 30 * 864e5;
  const fresh = vals.filter(a => a.joined && new Date(a.joined).getTime() >= freshCut);
  const newcomerPool = fresh.length ? fresh : vals.filter(a => a.joined).sort((a, b) => new Date(b.joined) - new Date(a.joined)).slice(0, 1);
  const newcomers = newcomerPool.sort((a, b) => b.sc / Math.max(1, b.n) - a.sc / Math.max(1, a.n) || kd(b) - kd(a)).slice(0, 3)
    .map(a => ({ name: a.nick, value: a.n ? (a.sc / a.n).toFixed(1) + ' ср.счёт' : 'новичок' }));
  const topBlock = rows('Лучший K/D', vals.filter(a => a.n >= 2).sort((a, b) => kd(b) - kd(a)).slice(0, 3).map(a => ({ name: a.nick, value: kd(a).toFixed(2) })))
    + rows('Больше всего убийств', vals.filter(a => a.n).sort((a, b) => b.k - a.k).slice(0, 3).map(a => ({ name: a.nick, value: a.k + ' K' })))
    + rows('Больше всего помощи', vals.filter(a => a.n).sort((a, b) => b.ast - a.ast).slice(0, 3).map(a => ({ name: a.nick, value: a.ast + ' П' })))
    + rows('Лучшая явка', vals.filter(a => a.tot >= 2).sort((a, b) => b.n / b.tot - a.n / a.tot).slice(0, 3).map(a => ({ name: a.nick, value: Math.round(a.n / a.tot * 100) + '%' })))
    + rows('Лучший новичок', newcomers);
  const bp = (v, l) => `<button class="ghost ${statPeriod === v ? 'on' : ''}" data-sp="${v}">${l}</button>`;
  const bg = (v, l) => `<button class="ghost ${statGroup === v ? 'on' : ''}" data-sg="${v}">${l}</button>`;
  body.innerHTML = pgHead('Аналитика', 'Динамика боёв, винрейт и эффективность игроков.',
      `${bp(7, '7 дней')}${bp(30, '30 дней')}${bp(0, 'Всё время')}${bg('day', 'По дням')}${bg('week', 'По неделям')}`)
    + `<div class="card"><h2>Активность клана</h2><div class="topcard">
    <div class="stat"><b>${allN}</b><span>боёв</span></div><div class="stat"><b>${allW}</b><span>побед</span></div>
    <div class="stat"><b>${allN ? Math.round(allW / allN * 100) + '%' : '—'}</b><span>винрейт</span></div>
    <div class="stat"><b>${allD ? (allK / allD).toFixed(2) : '—'}</b><span>средний K/D</span></div></div>${chart}${trend}</div>
    ${modeCard}
    <h2 style="margin:4px 0 12px">Топ клана</h2><div class="grid">${topBlock}</div>`;
  body.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => { statPeriod = Number(b.dataset.sp); viewStats(); });
  body.querySelectorAll('[data-sg]').forEach(b => b.onclick = () => { statGroup = b.dataset.sg; viewStats(); });
}

  pl.data.forEach(p => { const a = agg[p.id]; a.tot = p.joined_at ? matchDates.filter(d => d >= new Date(p.joined_at)).length : total; });
  st.data.forEach(s => {
    const a = agg[s.player_id]; if (!a || idleStat(s)) return;
    a.n++; a.k += s.kills || 0; a.d += s.deaths || 0; a.ast += s.assists || 0; a.sc += s.score || 0;
    const t = s.matches.played_at; if (!a.last || t > a.last) a.last = t;
  });
  Object.values(agg).forEach(a => { a.tot = Math.max(a.tot, a.n); });
  const list = Object.values(agg)
    .filter(a => !ratingSquad || (ratingSquad === 'none' ? !a.sid : a.sid === ratingSquad))
    .sort((x, y) => y.n - x.n || y.k - x.k);
  const pb = (v, l) => `<button class="ghost ${period === v ? 'on' : ''}" data-p="${v}">${l}</button>`;

  const played = list.reduce((s, a) => s + a.n, 0);
  const slots = list.reduce((s, a) => s + a.tot, 0);
  const avgAtt = slots ? Math.round(played / slots * 100) : 0;
  const activeN = list.filter(a => a.n > 0).length;
  const actPct = list.length ? Math.round(activeN / list.length * 100) : 0;

  const attendance = a => {

    return { cls: bad ? 'badrow' : 'warnrow', note: `<span class="att ${bad ? 'err' : ''}">пропустил ${miss} из ${a.tot}</span>` };
  };
  const rows = list.map((a, i) => { const at = attendance(a); return `<tr class="${at.cls || (a.n ? '' : 'dim')}"><td><span class="place ${i < 3 ? 'p' + (i + 1) : ''}">${i + 1}</span></td><td>${plLink(a.id, a.nick)}</td><td>${esc(a.sq)}</td>

let CATALOG = null;
async function loadCatalog() {
  if (CATALOG) return CATALOG;

  if (!r.ok) throw new Error('Каталог не загрузился (файл catalog.json должен лежать рядом с index.html)');

function searchCatalog(cat, group, q, rank) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);

    .sort((a, b) => RANK_ORDER.indexOf(a.r) - RANK_ORDER.indexOf(b.r) || a.n.localeCompare(b.n, 'ru'));
}

async function openPicker(group, onPick) {

async function viewPlayer() {
  const body = document.getElementById('body');
  if (!playerId) { tab = 'rating'; return render(); }
  const since = period ? new Date(Date.now() - period * 864e5).toISOString() : '1970-01-01T00:00:00Z';
  const [pr, ms, st, sq] = await Promise.all([
    sb.from('players').select('*').eq('id', playerId).maybeSingle(),
    sb.from('matches').select('id,played_at,mode,result,place').eq('clan_id', clan.id).gte('played_at', since).order('played_at', { ascending: false }).limit(100),
    sb.from('match_stats').select('match_id,kills,deaths,assists,score').eq('player_id', playerId).eq('confirmed', true),
    sb.from('squads').select('id,name').eq('clan_id', clan.id)
  ]);
  const err = pr.error || ms.error || st.error || sq.error;
  if (err) return body.innerHTML = failBox(err);
  const p = pr.data;
  if (!p) return body.innerHTML = '<div class="card mut">Игрок не найден.</div>';
  let prof = null, card = null;
  if (p.user_id) {
    const r = await Promise.all([sb.from('profiles').select('*').eq('user_id', p.user_id).maybeSingle(), sb.from('user_cards').select('*').eq('user_id', p.user_id).maybeSingle()]);
    prof = r[0].data; card = r[1].data;
  }
  const by = Object.fromEntries(st.data.map(s => [s.match_id, s]));
  const rows = ms.data.map(m => ({ m, s: by[m.id] && !idleStat(by[m.id]) ? by[m.id] : null }));
  const played = rows.filter(r => r.s);
  const sum = f => played.reduce((a, r) => a + (r.s[f] || 0), 0);
  const k = sum('kills'), d = sum('deaths'), ast = sum('assists'), sc = sum('score');
  const best = played.reduce((a, r) => Math.max(a, r.s.score || 0), 0);
  const sqn = (sq.data.find(x => x.id === p.squad_id) || {}).name;
  const stat = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  const pb = (v, l) => `<button class="ghost ${period === v ? 'on' : ''}" data-p="${v}">${l}</button>`;
  const seq = rows.slice(0, 30).reverse();
  const mx = Math.max(1, ...seq.map(r => r.s ? r.s.score || 0 : 0)), bw = 12, gap = 4, H = 70;
  const bars = seq.map((r, i) => { const h = r.s ? Math.max(3, (r.s.score || 0) / mx * H) : 3;
    return `<rect x="${i * (bw + gap)}" y="${H - h}" width="${bw}" height="${h}" rx="2" style="fill:var(${r.s ? '--ac' : '--bd'})"/>`; }).join('');
  const chart = seq.length ? `<p class="mut" style="margin:12px 0 4px">Счёт по боям (слева старые, серые полоски — не явился)</p>
    <svg viewBox="0 0 ${Math.max(320, seq.length * (bw + gap) - gap)} ${H}" preserveAspectRatio="xMinYMid meet" style="width:100%;height:90px">${bars}</svg>` : '';
  const hist = rows.slice(0, 15).map(r => r.s
    ? `<tr><td>${fmtTime(r.m.played_at)}</td><td>${r.s.kills ?? '—'}</td><td>${r.s.deaths ?? '—'}</td><td>${r.s.assists ?? '—'}</td><td>${r.s.score ?? '—'}</td></tr>`
    : `<tr class="dim"><td>${fmtTime(r.m.played_at)}</td><td colspan="4">не явился</td></tr>`).join('');
  const modeRows = ['Потасовка', 'Турнир', 'Захват базы'].map(mode => {
    const set = played.filter(r => String(r.m.mode || '').toLowerCase().includes(mode.toLowerCase()));
    const kk = set.reduce((a, r) => a + (r.s.kills || 0), 0);
    const dd = set.reduce((a, r) => a + (r.s.deaths || 0), 0);
    const aa = set.reduce((a, r) => a + (r.s.assists || 0), 0);
    return `<tr><td>${mode}</td><td>${set.length}</td><td>${kk}</td><td>${dd}</td><td>${aa}</td><td><b>${dd ? (kk / dd).toFixed(2) : '—'}</b></td><td><b>${dd ? ((kk + aa) / dd).toFixed(2) : '—'}</b></td></tr>`;
  }).join('');
  const modeCard = `<div class="card wrap"><h2>Статистика по режимам</h2>
    <p class="mut">K/D и KDA считаются автоматически из записанных кланом боёв.</p>
    <table><tr><th>Режим</th><th>Боёв</th><th>K</th><th>D</th><th>П</th><th>K/D</th><th>KDA</th></tr>${modeRows}</table></div>`;
  const gear = prof ? `<div class="card"><h2>Снаряга и показатели</h2><div id="gear_host"></div>
    <div style="margin-top:10px">${factionChip(prof.faction)}<span class="chip ok">${GEAR[prof.gear_level] || '—'}</span><span class="chip">${prof.mic ? 'С микрофоном' : 'Без микрофона'}</span></div>
    <div class="stats">${stat(prof.kd ?? '—', 'K/D')}${stat(prof.ehp ?? '—', 'приведёнка')}${stat(prof.speed ?? '—', 'скорость')}${stat((prof.tournaments_per_week ?? 0) + ' в нед.', 'турниры')}</div>
    ${prof.gear_notes ? `<p style="margin-top:10px">${esc(prof.gear_notes)}</p>` : ''}</div>` : '';
  body.innerHTML = `<button class="ghost" id="pback">${playerBack ? '← Назад' : '← К рейтингу'}</button>
    <div class="card" style="margin-top:12px"><div class="brand" style="gap:14px">${avImg(card && card.avatar_url, 'lg') || `<div class="av ph lg">${esc(p.nick.slice(0, 2).toUpperCase())}</div>`}
      <div><h2 style="margin:0 0 6px">${esc(p.nick)}</h2>${sqn ? `<span class="chip">Отряд: ${esc(sqn)}</span>` : ''}${p.user_id ? '<span class="chip ok">Аккаунт привязан</span>' : '<span class="chip">Игрок ещё не зарегистрирован на сайте</span>'}${p.active ? '' : '<span class="chip">Не в составе</span>'}</div></div>
      <div class="row" style="margin-top:10px">${p.user_id ? '<button class="ghost" id="puprofile">Профиль пользователя</button>' : ''}${p.user_id && p.user_id !== user.id ? '<button class="ghost" id="pdm">Написать</button>' : ''}</div></div>
    <div class="row">${pb(7, '7 дней')}${pb(30, '30 дней')}${pb(0, 'Всё время')}</div>
    <div class="card"><h2>Статистика за период</h2><p class="mut">Боёв клана: ${rows.length}</p>
      <div class="stats">${stat(played.length, 'боёв сыграно')}${stat(rows.length ? Math.round(played.length / rows.length * 100) + '%' : '—', 'явка')}
      ${stat(d ? (k / d).toFixed(2) : '—', 'K/D')}${stat(played.length ? Math.round(sc / played.length) : '—', 'средний счёт')}
      ${stat(best || '—', 'лучший счёт')}${stat(ast, 'помощь')}${stat(k + ' / ' + d, 'убийства / смерти')}${stat(sc, 'счёт всего')}</div>${chart}</div>
    ${gear}
    ${modeCard}
    ${hist ? `<div class="card wrap"><h2>Последние бои</h2><table><tr><th>Дата</th><th>K</th><th>D</th><th>П</th><th>Счёт</th></tr>${hist}</table></div>` : '<div class="card mut">За выбранный период боёв нет.</div>'}`;
  document.getElementById('pback').onclick = () => {
    const back = playerBack; playerBack = null;
    if (back) back(); else { tab = 'rating'; render(); }
  };
  const pup = document.getElementById('puprofile');
  if (pup) pup.onclick = () => viewUserCard(p.user_id, () => openPlayer(p.id, playerBack));
  const gh = document.getElementById('gear_host');
  if (gh && prof) loadCatalog().catch(() => null).then(cat => renderGear(gh, gearOf(prof), byIdOf(cat)));
  const dm = document.getElementById('pdm');
  if (dm) dm.onclick = () => openDm(p.user_id);
  body.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { period = Number(b.dataset.p); viewPlayer(); });
}

const idleStat = s => s.kills === 0 && s.deaths === 0 && s.assists === 0 && s.score === 0;

let dashRange = 7, dashMetric = 'kd', dashPage = 0;
let dashMode = 'tiles';
try { dashMode = localStorage.getItem('cp_dash_mode') || 'tiles'; } catch (e) {}
const isWinMatch = m => /побед/i.test(m.result || '') || m.place === 1;

async function viewDashboard() {
  const body = document.getElementById('body');
  const since = dashRange ? new Date(Date.now() - dashRange * 864e5).toISOString() : '1970-01-01T00:00:00Z';
  const [mr, pl, sq] = await Promise.all([
    sb.from('matches').select('id,played_at,mode,result,place,team_score,extra,match_stats(player_id,nick_raw,kills,deaths,assists,score)')
      .eq('clan_id', clan.id).gte('played_at', since).order('played_at', { ascending: false }).limit(200),
    sb.from('players').select('id,nick,user_id,squad_id,active,joined_at').eq('clan_id', clan.id),
    sb.from('squads').select('id,name').eq('clan_id', clan.id)
  ]);
  const err = mr.error || pl.error || sq.error;
  if (err) return body.innerHTML = failBox(err);
  const matches = mr.data || [], players = pl.data || [], squads = sq.data || [];
  if (!players.length) {
    body.innerHTML = `<div class="card empty"><div class="eico">${ICONS.users}</div><h3>Состав пока пуст</h3>
      <p>Добавь игроков — и здесь появится сводка клана.</p>${canEdit() ? '<button data-go="roster">Перейти в состав</button>' : ''}</div>`;
    const j = body.querySelector('[data-go]'); if (j) j.onclick = () => { tab = j.dataset.go; render(); };
    return;
  }
  const wins = matches.filter(isWinMatch).length, losses = matches.length - wins;
  const wr = matches.length ? Math.round(wins / matches.length * 100) : 0;
  const sqName = Object.fromEntries(squads.map(s => [s.id, s.name]));
  const agg = {};
  players.forEach(p => { agg[p.id] = { id: p.id, nick: p.nick, sid: p.squad_id, n: 0, k: 0, d: 0, a: 0, sc: 0 }; });
  matches.forEach(m => (m.match_stats || []).forEach(s => {
    if (idleStat(s)) return;
    const x = agg[s.player_id]; if (!x) return;
    x.n++; x.k += s.kills || 0; x.d += s.deaths || 0; x.a += s.assists || 0; x.sc += s.score || 0;
  }));
  const f2 = v => (Math.round(v * 100) / 100).toFixed(2);
  const mv = x => dashMetric === 'kills' ? x.k : dashMetric === 'kda' ? (x.k + x.a) / Math.max(1, x.d)
    : dashMetric === 'avg' ? x.sc / Math.max(1, x.n) : x.k / Math.max(1, x.d);
  const top = Object.values(agg).filter(x => x.n > 0).sort((a, b) => mv(b) - mv(a)).slice(0, 5);
  const topHtml = top.length ? top.map((x, i) => `<div class="db-player">
    <span class="db-rank ${i < 3 ? 'p' + (i + 1) : ''}">${i + 1}</span>
    <span class="db-who">${plLink(x.id, x.nick)}<small>${x.n} матчей · ${esc(sqName[x.sid] || 'Без отряда')}</small></span>
    <span class="db-kd"><span class="k">${x.k}</span> / <span class="d">${x.d}</span> / <span class="a">${x.a}</span></span>
    <span class="db-metrics">
      <span class="db-metric ${dashMetric === 'kd' ? 'hot' : ''}">K/D <b>${f2(x.k / Math.max(1, x.d))}</b></span>
      <span class="db-metric ${dashMetric === 'kda' ? 'hot' : ''}">KDA <b>${f2((x.k + x.a) / Math.max(1, x.d))}</b></span>
      <span class="db-metric ${dashMetric === 'avg' ? 'hot' : ''}">СР.ГР. <b>${Math.round(x.sc / Math.max(1, x.n))}</b></span>
      <span class="db-metric ${dashMetric === 'kills' ? 'hot' : ''}">ФРАГИ <b>${x.k}</b></span></span></div>`).join('') : '<p class="mut">Нет данных за период.</p>';
  const sAgg = {};
  Object.values(agg).filter(x => x.n > 0 && x.sid).forEach(x => {
    const s = sAgg[x.sid] || (sAgg[x.sid] = { n: 0, k: 0, d: 0, members: [] });
    s.n += x.n; s.k += x.k; s.d += x.d; s.members.push(x);
  });
  const sqTop = Object.values(sAgg).sort((a, b) => b.k / Math.max(1, b.d) - a.k / Math.max(1, a.d)).slice(0, 3);
  const sqHtml = sqTop.length ? sqTop.map((s, i) => {
    const id = s.members[0].sid;
    return `<div class="db-squad"><span class="db-rank ${i < 3 ? 'p' + (i + 1) : ''}">${i + 1}</span>
      <span class="db-who"><b>${esc(sqName[id] || 'Отряд')}</b><small>${s.members.slice(0, 4).map(p => esc(p.nick)).join(', ')}</small></span>
      <span class="db-kd">K/D <b>${f2(s.k / Math.max(1, s.d))}</b> · WR <b>${Math.round(s.members.filter(p => p.n > 0).length / s.members.length * 100)}%</b></span></div>`;
  }).join('') : '<p class="mut">Нет данных по отрядам.</p>';
  let bk = { v: 0, n: '—' }, bs = { v: 0, n: '—' }, best = 0, cur = 0, sn = '—';
  matches.slice().reverse().forEach(m => {
    if (isWinMatch(m)) { cur++; if (cur > best) { best = cur; const s = (m.match_stats || [])[0]; sn = s && s.nick_raw ? s.nick_raw : 'Клан'; } } else cur = 0;
    (m.match_stats || []).forEach(s => {
      if ((s.kills || 0) > bk.v) bk = { v: s.kills || 0, n: s.nick_raw || 'Игрок' };
      if ((s.score || 0) > bs.v) bs = { v: s.score || 0, n: s.nick_raw || 'Игрок' };
    });
  });
  const ach = (ic, title, sub, val, unit) => `<div class="db-ach">${svg(18, ic)}<span><b>${esc(sub)}</b><small>${esc(title)}</small></span><span class="val">${val}<small>${esc(unit)}</small></span></div>`;
  const achHtml = ach('<path d="M12 2 4 6v6c0 5 3.4 8.4 8 10 4.6-1.6 8-5 8-10V6z"/>', 'максимум убийств в матче', bk.n, bk.v, 'фрагов')
    + ach('<path d="M12 2c2 4-2 5 0 9 2-2 4-3 4-5 3 3 5 6 5 9a9 9 0 0 1-18 0c0-4 3-7 6-9-1 3 1 4 3 5-2-4 2-5 0-9z"/>', 'самая длинная серия побед', sn, best, 'побед')
    + ach('<path d="M13 2 4 14h6l-1 8 9-12h-6z"/>', 'максимум очков в матче', bs.n, bs.v, 'очков');
  const mine = players.filter(p => p.user_id === user.id || p.id === playerId).map(p => p.id);
  const pages = Math.max(1, Math.ceil(matches.length / 6));
  if (dashPage >= pages) dashPage = pages - 1;
  const cards = matches.slice(dashPage * 6, dashPage * 6 + 6).map(m => {
    const teams = (m.extra && m.extra.teams) || [];
    const opp = teams.find(t => !t.own), own = teams.find(t => t.own);
    const so = m.team_score != null ? m.team_score : (own ? own.score : null);
    const sa = opp && opp.score != null ? opp.score : null;
    const win = isWinMatch(m);
    const st = (mine.length ? (m.match_stats || []).filter(s => mine.includes(s.player_id)) : (m.match_stats || []).filter(s => !idleStat(s)));
    const k = st.reduce((t, s) => t + (s.kills || 0), 0), d = st.reduce((t, s) => t + (s.deaths || 0), 0);
    const a = st.reduce((t, s) => t + (s.assists || 0), 0), sc = st.reduce((t, s) => t + (s.score || 0), 0);
    const map = m.extra && m.extra.map ? (TAC_MAPS[m.extra.map] ? TAC_MAPS[m.extra.map].name : m.extra.map) : '';
    return `<div class="mcard ${win ? 'win' : 'loss'}"><div class="mcard-top"><span class="mres">${win ? 'ПОБЕДА' : 'ПОРАЖЕНИЕ'}</span><span class="mdate">${esc(fmtTime(m.played_at))}</span></div>
      <div class="mopp">${esc(opp ? opp.name : 'Без противника')}</div><div class="mlabel">счёт битвы</div>
      <div class="mscore ${win ? 'win' : 'loss'}">${so == null ? '—' : so} : ${sa == null ? '—' : sa}</div>
      <div class="mchips">${m.mode ? `<span>${esc(m.mode)}</span>` : ''}${map ? `<span>${esc(map)}</span>` : ''}<span>Текущий сезон</span></div>
      <div class="mstat"><div>K<b>${k}</b></div><div>Д<b>${d}</b></div><div>A<b>${a}</b></div><div>СЧЁТ<b>${sc}</b></div><div>K/D<b>${f2(k / Math.max(1, d))}</b></div><div>KDA<b>${f2((k + a) / Math.max(1, d))}</b></div><div>УЧ.<b>${(m.match_stats || []).length}</b></div></div></div>`;
  }).join('') || '<p class="mut">Матчей за период нет.</p>';
  const seg = (items, key, cur) => `<div class="db-seg">${items.map(([v, l]) => `<button data-${key}="${v}" class="${cur === v ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  body.innerHTML = `<div class="db-layout-${dashMode === 'side' ? 'side' : 'tiles'}">
    <div class="db-head"><div class="db-brand"><div class="db-logo">${svg(24, '<path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>')}</div>
      <div><span class="db-kicker">ГЛАВНАЯ ПАНЕЛЬ КЛАНА</span><h2>${esc(clan.name)}</h2><p>Сводка лучших игроков, отрядов и достижений за выбранный период</p></div></div>
      <div class="db-ctrls">${seg([[7, 'НЕДЕЛЯ'], [30, 'МЕСЯЦ'], [90, 'СЕЗОН']], 'range', dashRange)}
      ${seg([['side', 'САЙДБАР'], ['tiles', 'ПЛИТКИ']], 'mode', dashMode)}</div></div>
    <div class="db-kpis">
      <div class="db-kpi"><span>Игр</span><b>${matches.length}</b></div>
      <div class="db-kpi g"><span>Побед</span><b>${wins}</b></div>
      <div class="db-kpi r"><span>Поражений</span><b>${losses}</b></div>
      <div class="db-kpi y"><span>Win-rate</span><b>${wr}%</b></div></div>
    <div class="db-grid"><div class="db-card">
      <div class="db-card-head"><div><h3>${svg(15, '<circle cx="12" cy="8" r="5"/><path d="M4 21a8 8 0 0 1 16 0"/>')} ТОП-5 ИГРОКОВ</div><button class="db-link" data-go="rating">Все игроки →</button></div>
      <p class="sub">Лучшие игроки за выбранный период</p>
      <div class="db-tabs">${[['kd', 'K/D'], ['kda', 'KDA'], ['kills', 'УБИЙСТВА'], ['avg', 'СР.ГР.']].map(([v, l]) => `<button data-metric="${v}" class="${dashMetric === v ? 'on' : ''}">${l}</button>`).join('')}</div>
      ${topHtml}</div>
      <div class="db-card"><div class="db-card-head"><div><h3>${svg(15, '<path d="M12 2 4 6v6c0 5 3.4 8.4 8 10 4.6-1.6 8-5 8-10V6z"/>')} ДОСТИЖЕНИЯ</div></div>
      <p class="sub">Рекорды клана за период</p>${achHtml}</div></div>
    <div class="db-card" style="margin-bottom:14px"><div class="db-card-head"><div><h3>${svg(15, '<path d="M9 3 3 6v15l6-3 6 3 6-3V3l-6 3z"/>')} ТОП ОТРЯДОВ</div></div><button class="db-link" data-go="team">Все отряды →</button></div>
      <p class="sub">По среднему K/D и винрейту</p>${sqHtml}</div>
    <div class="db-card"><div class="db-card-head"><div><h3>${svg(15, '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/>')} МОИ ИГРЫ</div></div><button class="db-link" data-go="history">Все игры →</button></div>
      <p class="sub">${matches.length} матчей за период · Страница ${dashPage + 1} из ${pages}</p>
      <div class="db-match-grid">${cards}</div>
      <div class="db-pager"><button data-page="-1" ${dashPage <= 0 ? 'disabled' : ''}>← Назад</button><span>Страница ${dashPage + 1} из ${pages}</span><button data-page="1" ${dashPage >= pages - 1 ? 'disabled' : ''}>Вперёд →</button></div></div>
  </div>`;
  wirePl(body);
  body.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { tab = b.dataset.go; render(); });
  body.querySelectorAll('[data-range]').forEach(b => b.onclick = () => { dashRange = Number(b.dataset.range); dashPage = 0; viewDashboard(); });
  body.querySelectorAll('[data-metric]').forEach(b => b.onclick = () => { dashMetric = b.dataset.metric; viewDashboard(); });
  body.querySelectorAll('[data-page]').forEach(b => b.onclick = () => { dashPage = Math.max(0, dashPage + Number(b.dataset.page)); viewDashboard(); document.getElementById('body').scrollIntoView({ behavior: 'smooth' }); });
  body.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { dashMode = b.dataset.mode; try { localStorage.setItem('cp_dash_mode', dashMode); } catch (e) {} viewDashboard(); });
}

async function viewHistory() {
  const body = document.getElementById('body');
  const [mr, pr] = await Promise.all([
    sb.from('matches').select('id,played_at,mode,result,place,team_score,extra,match_stats(player_id,nick_raw,kills,deaths,assists,score)')
      .eq('clan_id', clan.id).order('played_at', { ascending: false }).limit(30),
    sb.from('players').select('id,nick,active,joined_at').eq('clan_id', clan.id)
  ]);
  const err = mr.error || pr.error;
  if (err) return body.innerHTML = failBox(err);
  if (!mr.data.length) {
    body.innerHTML = `<div class="card empty"><div class="eico">${ICONS.sword}</div><h3>Боёв пока нет</h3><p>Добавь первый бой — и в истории появятся результаты, явка и статистика игроков.</p>${canEdit() ? '<button data-jump="match">Добавить бой</button>' : ''}</div>`;
    const jump = body.querySelector('[data-jump]');
    if (jump) jump.onclick = () => { tab = 'match'; render(); };
    return;
  }
  const mapOpts = Object.fromEntries(Object.entries(TAC_MAPS).map(([k, v]) => [k, v.name]));
  const nv = v => v == null ? '—' : v;
  const hwins = mr.data.filter(m => (m.result || '').toLowerCase().includes('побед') || m.place === 1).length;
  const hwr = mr.data.length ? Math.round(hwins / mr.data.length * 100) : 0;
  const hkills = mr.data.reduce((a, m) => a + m.match_stats.reduce((x, s) => x + (s.kills || 0), 0), 0);
  const card = (m, open) => {
    const present = m.match_stats.filter(s => !idleStat(s)).sort((a, b) => (b.score || 0) - (a.score || 0));
    const shown = new Set(present.map(s => s.player_id));
    const absent = pr.data.filter(p => p.active && !shown.has(p.id) && !(p.joined_at && new Date(p.joined_at) > new Date(m.played_at)));
    const teams = (m.extra && m.extra.teams) || [];
    const opp = teams.filter(t => !t.own && !(m.place != null && t.place === m.place && t.score === m.team_score));
    const rows = present.map(s => `<tr><td>${plLink(s.player_id, s.nick_raw)}</td><td>${nv(s.kills)}</td><td>${nv(s.deaths)}</td><td>${nv(s.assists)}</td><td>${nv(s.score)}</td></tr>`).join('')
      + absent.map(p => `<tr class="dim"><td>${plLink(p.id, p.nick)}</td><td colspan="4">не явился</td></tr>`).join('');
    const emap = (m.extra && m.extra.map) || '';
    return `<div class="card"><details ${open ? 'open' : ''}><summary><b>${fmtTime(m.played_at)}</b>${m.mode ? ' · ' + esc(m.mode) : ''}${emap && TAC_MAPS[emap] ? ' · ' + esc(TAC_MAPS[emap].name) : ''}${m.result ? ' · ' + esc(m.result) : ''}${m.place ? ' · ' + m.place + ' место' : ''}
      <span class="mut">· явилось ${present.length} из ${present.length + absent.length}</span></summary>
      ${m.team_score != null ? `<p class="mut">Очки клана: ${m.team_score}</p>` : ''}
      ${opp.length ? `<p class="mut" style="margin-bottom:2px">Противники:</p><div>${opp.map(t => `<span class="chip">${esc(t.name)} · ${nv(t.score)}${t.place ? ' (' + t.place + ' место)' : ''}</span>`).join('')}</div>` : ''}
      <div class="wrap"><table><tr><th>Игрок</th><th>K</th><th>D</th><th>П</th><th>Счёт</th></tr>${rows}</table></div>
      ${canEdit() ? `<div class="row" style="margin-top:8px"><select id="em_${m.id}">${selOpts(MATCH_MODES, m.mode || '', 'Режим')}</select>

    + `<div class="pg-kpis">

        <div class="pg-kpi"><span>Убийств</span><b>${hkills}</b></div></div>`

    viewHistory();
  });
}

async function loadPlayers() {
  const { data, error } = await sb.from('players').select('*').eq('clan_id', clan.id).order('nick');
  if (error) throw error;
  return data;
}

async function loadSquads() {
  const { data, error } = await sb.from('squads').select('*').eq('clan_id', clan.id).order('name');
  if (error) throw error;
  return data;
}

// clan_members и players — разные таблицы: при вступлении по ссылке запись
// в players не появляется, поэтому человек «в клане», но не в составе,
// не виден в отрядах и не попадает в бои. Досоздаём запись и/или привязываем user_id.
const memberNick = (m, profiles) => ((profiles.find(p => p.user_id === m.user_id) || {}).nickname || m.display_name || '').trim().slice(0, 40);
async function syncRoster(members, profiles, players) {
  if (!canEdit()) return { added: 0, error: '' };
  const byUser = new Map(players.filter(p => p.user_id).map(p => [p.user_id, p]));
  const add = [], link = [];
  for (const m of members) {
    const nick = memberNick(m, profiles);
    if (!nick) continue;
    const p = byUser.get(m.user_id) || players.find(x => (x.nick || '').toLowerCase() === nick.toLowerCase());
    if (!p) add.push({ clan_id: clan.id, nick, user_id: m.user_id, active: true, joined_at: new Date().toISOString() });
    else if (!p.user_id) link.push({ id: p.id, user_id: m.user_id });
  }
  if (!add.length && !link.length) return { added: 0, error: '' };
  let error = '';
  for (const l of link) {
    const r = await sb.from('players').update({ user_id: l.user_id }).eq('id', l.id);
    if (r.error) error = r.error.message;
  }
  if (add.length) {
    const r = await sb.from('players').upsert(add, { onConflict: 'clan_id,nick', ignoreDuplicates: true });
    if (r.error) error = r.error.message;
  }
  return { added: add.length + link.length, error };
}

      loadPlayers(), loadSquads(),
      sb.from('clan_members').select('user_id,rank,display_name').eq('clan_id', clan.id),
      sb.from('profiles').select('user_id,nickname,faction').limit(1000),
      sb.from('match_stats').select('player_id,kills,deaths,assists,score,confirmed')

  const err = mb.error || pf.error || stt.error;

  const sync = await syncRoster(members, profiles, players);
  if (sync.added) { try { players = await loadPlayers(); } catch (e) {} }

  const mByName = Object.fromEntries(members.filter(m => m.display_name).map(m => [m.display_name, m]));
  const pByUser = Object.fromEntries(profiles.map(p => [p.user_id, p]));
  const pByName = Object.fromEntries(profiles.filter(p => p.nickname).map(p => [p.nickname, p]));

    const m = p.user_id ? mByUser[p.user_id] : mByName[p.nick];

async function tacLoadRemote() {

// Рисует одну метку. Координаты хранятся в долях карты (0..1), поэтому
// разметка не зависит от размера экрана и resolution-independent при экспорте.
function tacPaint(ctx, W, H, s, view) {
  if (s.t === 'stamp') return tacStamp(ctx, W, H, s, view || 1);
  const pts = s.pts;
  if (!pts || !pts.length) return;
  const P = i => [pts[i][0] * W, pts[i][1] * H];
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalCompositeOperation = s.t === 'erase' ? 'destination-out' : 'source-over';
  ctx.strokeStyle = s.c; ctx.fillStyle = s.c;
  ctx.lineWidth = Math.max(1, (s.w || 0.004) * W);
  if (s.t === 'line' || s.t === 'arrow') {
    const a = P(0), b = P(pts.length - 1);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    if (s.t === 'arrow') {
      const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
      const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
      // Головка не должна быть больше самой линии (особенно при толстой кисти).
      const L = Math.max(10, Math.min(ctx.lineWidth * 2.2, len * 0.45));
      ctx.beginPath(); ctx.moveTo(b[0], b[1]);
      ctx.lineTo(b[0] - L * Math.cos(ang - 0.45), b[1] - L * Math.sin(ang - 0.45));
      ctx.lineTo(b[0] - L * Math.cos(ang + 0.45), b[1] - L * Math.sin(ang + 0.45));
      ctx.closePath(); ctx.fill();
    }
  } else if (pts.length === 1) {
    const a = P(0);
    ctx.beginPath(); ctx.arc(a[0], a[1], Math.max(1, ctx.lineWidth / 2), 0, 6.2832); ctx.fill();
  } else {
    ctx.beginPath(); ctx.moveTo(P(0)[0], P(0)[1]);
    for (let i = 1; i < pts.length; i++) { const p = P(i); ctx.lineTo(p[0], p[1]); }
    ctx.stroke();
  }
  ctx.restore();
}

// Штамп-метка: цвет и тип кольца кодируют сторону (свой/враг), форма — тип метки.
// view — текущий зум, чтобы на экране метка росла медленнее карты и не закрывала её.
function tacStamp(ctx, W, H, s, view) {
  const p = s.pts && s.pts[0];
  if (!p) return;
  const side = s.side === 'enemy' ? 'enemy' : 'ally';
  const col = TAC_SIDE[side][1];
  ctx.save();
  ctx.translate(p[0] * W, p[1] * H);
  if (s.k === 'cap') {
    // Точка захвата в стиле карты клановых боёв: тёмный квадрат с буквой
    // и четыре белых угловых скобки. Размер ~4,6% ширины карты.
    const box = Math.max(14, Math.min(90, W * 0.046 / Math.sqrt(Math.max(1, view))));
    const half = box / 2, rad = box * .12;
    ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = box * .35; ctx.shadowOffsetY = box * .08;
    ctx.fillStyle = 'rgba(16,18,22,.86)';
    ctx.beginPath();
    ctx.moveTo(-half + rad, -half);
    ctx.arcTo(half, -half, half, half, rad); ctx.arcTo(half, half, -half, half, rad);
    ctx.arcTo(-half, half, -half, -half, rad); ctx.arcTo(-half, -half, half, -half, rad);
    ctx.closePath(); ctx.fill();
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    const len = box * .22, off = box * .04;
    ctx.strokeStyle = s.pre ? '#ffffff' : col;
    ctx.lineWidth = Math.max(1.2, box * .045); ctx.lineCap = 'square';
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
      const cx = sx * (half + off), cy = sy * (half + off);
      ctx.beginPath(); ctx.moveTo(cx - sx * len, cy); ctx.lineTo(cx, cy); ctx.lineTo(cx, cy - sy * len); ctx.stroke();
    }
    ctx.fillStyle = '#ffffff';
    ctx.font = '700 ' + Math.round(box * .56) + "px 'Russo One','Exo 2',sans-serif";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(s.letter || 'A', 0, box * .03);
    ctx.restore();
    return;
  }
  const r = Math.max(9, W * 0.017 / Math.sqrt(Math.max(1, view)));
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = r * .55; ctx.shadowOffsetY = r * .12;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832);
  ctx.fillStyle = '#0b1020'; ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.lineWidth = Math.max(1.5, r * .16); ctx.strokeStyle = col;
  if (side === 'enemy') ctx.setLineDash([Math.max(2, r * .42), Math.max(2, r * .3)]);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.stroke();
  ctx.setLineDash([]);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = col; ctx.fillStyle = col;
  if (s.k === 'rally') {
    ctx.beginPath();
    ctx.moveTo(r * .14, -r * .62); ctx.lineTo(-r * .36, r * .06); ctx.lineTo(-r * .04, r * .06);
    ctx.lineTo(-r * .14, r * .62); ctx.lineTo(r * .38, -r * .12); ctx.lineTo(r * .06, -r * .12);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(0, -r * .62); ctx.lineTo(r * .66, r * .44); ctx.lineTo(-r * .66, r * .44);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0, -r * .06); ctx.lineTo(r * .23, r * .44); ctx.lineTo(-r * .23, r * .44);
    ctx.closePath(); ctx.fillStyle = '#0b1020'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(-r * .82, r * .52); ctx.lineTo(r * .82, r * .52);
    ctx.lineWidth = Math.max(1.2, r * .12); ctx.stroke();
  }
  ctx.restore();
}

// Красивый диалог подтверждения вместо нативного confirm.
function tacConfirm(title, text, okText) {
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.className = 'tac-dlg';
    ov.innerHTML = `<div class="tac-dlg-box" role="dialog" aria-modal="true" aria-labelledby="tdlt" aria-describedby="tdld">
      <div class="tac-dlg-ico">${svg(22, '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/>')}</div>
      <h3 id="tdlt">${esc(title)}</h3>
      <p id="tdld">${esc(text)}</p>
      <div class="tac-dlg-act"><button class="ghost" data-no>Отмена</button><button class="danger" data-yes>${esc(okText || 'Очистить')}</button></div>
    </div>`;
    document.body.append(ov);
    const prev = document.activeElement;
    const no = ov.querySelector('[data-no]'), yes = ov.querySelector('[data-yes]');
    let done = false;
    const close = ok => {
      if (done) return;
      done = true;
      document.removeEventListener('keydown', onKey, true);
      document.body.style.overflow = '';
      ov.classList.remove('on');
      setTimeout(() => ov.remove(), 140);
      if (prev && prev.focus) { try { prev.focus(); } catch (e) {} }
      resolve(ok);
    };
    const onKey = e => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); return close(false); }
      if (e.key !== 'Tab') return;
      const items = [no, yes];
      const i = items.indexOf(document.activeElement);
      if (e.shiftKey && i <= 0) { e.preventDefault(); yes.focus(); }
      else if (!e.shiftKey && i === items.length - 1) { e.preventDefault(); no.focus(); }
    };
    document.addEventListener('keydown', onKey, true);
    document.body.style.overflow = 'hidden';
    ov.addEventListener('click', e => { if (e.target === ov) close(false); });
    no.onclick = () => close(false);
    yes.onclick = () => close(true);
    requestAnimationFrame(() => { ov.classList.add('on'); no.focus(); });
  });
}

      document.removeEventListener('keydown', onKey, true);
      document.body.style.overflow = '';
      ov.classList.remove('on');
      setTimeout(() => ov.remove(), 140);
      resolve(val);
    };
    const onKey = e => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); return close(null); }
      if (e.key !== 'Tab') return;
      const items = [titleEl, notesEl, no, yes];
      const i = items.indexOf(document.activeElement);
      if (e.shiftKey && i <= 0) { e.preventDefault(); yes.focus(); }
      else if (!e.shiftKey && i === items.length - 1) { e.preventDefault(); titleEl.focus(); }
    };
    document.addEventListener('keydown', onKey, true);
    document.body.style.overflow = 'hidden';
    ov.addEventListener('click', e => { if (e.target === ov) close(null); });
    no.onclick = () => close(null);
    yes.onclick = () => {
      const title = titleEl.value.trim();
      if (!title) { titleEl.focus(); return; }

}

function renderTacOnline() {

function renderTacCursors() {
  const host = document.getElementById('tac_cursors');
  if (!host) return;
  const now = Date.now();
  const items = Object.entries(TAC_CURSORS).filter(([id, c]) => c.map === TAC.map && now - c.at < 9000);

    return `<div class="tac-cur" style="left:${(c.x * 100).toFixed(2)}%;top:${(c.y * 100).toFixed(2)}%;--cc:hsl(${hue} 85% 62%)"><span>${esc(c.nick)}</span></div>`;

}

function tacStopRealtime() {
  if (TAC_CHAN) { try { sb.removeChannel(TAC_CHAN); } catch (e) {} TAC_CHAN = null; }
  TAC_CURSORS = {}; TAC_LIVE = {};
}
function tacStartRealtime() {
  if (!sb || !clan || !user || TAC_CHAN) return;
  TAC_CHAN = sb.channel('tactics-' + clan.id)
    .on('presence', { event: 'sync' }, () => {
      try {
        const state = TAC_CHAN.presenceState() || {};
        TAC_ONLINE = {};
        Object.values(state).forEach(list => (list || []).forEach(p => {
          if (p && p.user_id) TAC_ONLINE[p.user_id] = { nick: String(p.nick || 'Игрок').slice(0, 24), map: p.map, at: Date.now() };
        }));
        renderTacOnline();
      } catch (e) {}
    })
    .on('broadcast', { event: 'cursor' }, ({ payload }) => {
      if (!payload || payload.map !== TAC.map || payload.user_id === user.id) return;
      TAC_CURSORS[payload.user_id] = { map: payload.map, x: Number(payload.x) || 0, y: Number(payload.y) || 0, nick: String(payload.nick || 'Игрок').slice(0, 24), at: Date.now() };
      renderTacCursors();
    })
    .on('broadcast', { event: 'live' }, ({ payload }) => {
      if (!payload || payload.map !== TAC.map || payload.user_id === user.id) return;
      TAC_LIVE[payload.user_id] = payload.mark;
      if (typeof window.tacPreviewLive === 'function') window.tacPreviewLive();
    })
    .on('broadcast', { event: 'live_end' }, ({ payload }) => {
      if (!payload) return;
      delete TAC_LIVE[payload.user_id];
      if (typeof window.tacPreviewLive === 'function') window.tacPreviewLive();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tactics_plans', filter: 'clan_id=eq.' + clan.id }, payload => {
      const row = payload && payload.new;
      if (!row || !TAC_MAPS[row.map_key]) return;
      // Supabase присылает событие и автору изменения — игнорируем его,
      // иначе вкладка перерисовывается на каждом собственном сохранении.
      if (user && row.updated_by === user.id) return;
      const v = Number(row.version) || 1;
      if (v <= (Number(TAC_PLAN.ver[row.map_key]) || 0)) return;
      const arr = TAC_PLAN.maps[row.map_key] || (TAC_PLAN.maps[row.map_key] = []);
      const next = Array.isArray(row.marks) ? row.marks : [];
      // Важно: меняем массив на месте — canvas держит ссылку на него.
      if (JSON.stringify(arr) !== JSON.stringify(next)) {
        arr.length = 0;
        next.forEach(s => arr.push(s));
        if (tab === 'tactics' && typeof window.tacRefreshCanvas === 'function') window.tacRefreshCanvas();
      }
      TAC_PLAN.ver[row.map_key] = v;
      saveLocalPlan();
      if (row.updated_at) { TAC_LAST_EDIT = row.updated_at; renderTacOnline(); }
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tactics_gallery', filter: 'clan_id=eq.' + clan.id }, () => renderGallery())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tactics_gallery_likes' }, () => renderGallery())
    .subscribe(status => {
      if (status === 'SUBSCRIBED' && TAC_CHAN && typeof TAC_CHAN.track === 'function') {
        TAC_CHAN.track({ user_id: user.id, nick: tacNick(), map: TAC.map }).catch(() => {});
      }
    });
}

function tacGalleryPreview(g) {
  const map = TAC_MAPS[g.map_key];
  const ov = document.createElement('div');
  ov.className = 'tac-dlg';
  ov.innerHTML = `<div class="tac-dlg-box tac-prev-box" role="dialog" aria-modal="true" aria-labelledby="tprev">
    <h3 id="tprev">${esc(g.title)}</h3>
    <p class="mut">${esc(map ? map.name : g.map_key)} · ${esc(g.author_nick || 'Игрок')}${g.notes ? ' · ' + esc(g.notes.replace(/\s+/g, ' ').slice(0, 120)) : ''}</p>
    <div class="tac-prev-host"><p class="mut">Загрузка…</p></div>
    <div class="tac-dlg-act"><button class="ghost" data-no>Закрыть</button></div>
  </div>`;
  document.body.append(ov);
  const close = () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = ''; ov.classList.remove('on'); setTimeout(() => ov.remove(), 140); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  document.body.style.overflow = 'hidden';
  ov.addEventListener('click', e => { if (e.target === ov || e.target.hasAttribute('data-no')) close(); });
  requestAnimationFrame(() => ov.classList.add('on'));
  const cv = document.createElement('canvas');
  cv.width = 1000; cv.height = Math.round(1000 * (map ? map.h / map.w : 0.7));
  const cx = cv.getContext('2d');
  const done = () => {
    (Array.isArray(g.marks) ? g.marks : []).forEach(s => tacPaint(cx, cv.width, cv.height, s, 1));
    const host = ov.querySelector('.tac-prev-host'); if (host) { host.textContent = ''; host.append(cv); }
  };
  const img = new Image();
  img.onload = () => { cx.drawImage(img, 0, 0, cv.width, cv.height); done(); };
  img.onerror = () => { cx.fillStyle = '#0b1020'; cx.fillRect(0, 0, cv.width, cv.height); done(); };
  if (map) img.src = map.file; else img.onerror();
}

async function sendTacticCard(g, to) {

async function renderGallery(hostOverride) {
  const host = hostOverride || document.getElementById('tac_gallery');
  if (!host) return;
  if (!sb || !clan) { host.innerHTML = '<p class="mut">Галерея доступна после входа в клан.</p>'; return; }
  const lk = user ? await sb.from('tactics_gallery_likes').select('gallery_id').eq('user_id', user.id) : { data: [] };
  const liked = new Set((lk.data || []).map(x => x.gallery_id));
  const lc = await sb.from('tactics_gallery_likes').select('gallery_id');
  const likeCounts = {};
  (lc.data || []).forEach(x => { likeCounts[x.gallery_id] = (likeCounts[x.gallery_id] || 0) + 1; });
  const { data, error } = await sb.from('tactics_gallery')
    .select('id,map_key,title,notes,marks,author_id,author_nick,created_at,pinned')
    .eq('clan_id', clan.id).order('pinned', { ascending: false }).order('created_at', { ascending: false }).limit(30);
  if (error || !Array.isArray(data)) {
    host.innerHTML = '<p class="mut">Галерея недоступна — примени в Supabase SQL-файл <b>tactics_collab.sql</b>.</p>';
    return;
  }
  if (!data.length) {
    host.innerHTML = '<p class="mut">Тактик пока нет. Нажми «Поделиться с кланом», чтобы опубликовать текущий план.</p>';
    return;
  }
  host.innerHTML = data.map(g => {
    const likes = likeCounts[g.id] || 0;
    return `<div class="tac-gitem" data-gid="${esc(g.id)}">
    <canvas class="tac-gthumb" width="200" height="130"></canvas>
    <div class="tac-gmeta"><b>${esc(g.title)}</b>${g.pinned ? '<span class="chip ok" style="margin:0">Закреплено</span>' : ''}
      <span>${esc(TAC_MAPS[g.map_key] ? TAC_MAPS[g.map_key].name : g.map_key)} · ${esc(g.author_nick || 'Игрок')} · ${esc(new Date(g.created_at).toLocaleString('ru-RU'))}</span>
      ${g.notes ? `<p>${esc(g.notes)}</p>` : ''}
      <div class="tac-gact">
        <button class="tac-tool ${liked.has(g.id) ? 'on' : ''}" data-glike="${esc(g.id)}" aria-label="Нравится">${TAC_HEART}<span>${likes}</span></button>
        ${canEdit() ? `<button class="tac-tool ${g.pinned ? 'on' : ''}" data-gpin="${esc(g.id)}">${TAC_PIN}<span>${g.pinned ? 'Открепить' : 'Закрепить'}</span></button>` : ''}
        <button class="tac-tool" data-gload="${esc(g.id)}">Взять в план</button>
        <button class="tac-tool" data-gchat="${esc(g.id)}">В чат</button>
        ${g.author_id === user.id || canEdit() ? `<button class="tac-tool" data-gedit="${esc(g.id)}">Изменить</button>` : ''}
        ${g.author_id === user.id || canEdit() ? `<button class="tac-tool" data-gdel="${esc(g.id)}">Удалить</button>` : ''}
      </div>
    </div>
  </div>`;
  }).join('');
  host.querySelectorAll('.tac-gitem').forEach(item => {
    const g = data.find(x => x.id === item.dataset.gid);
    if (!g) return;
    const c = item.querySelector('canvas'), cx = c.getContext('2d');
    const drawMarks = () => { (Array.isArray(g.marks) ? g.marks : []).forEach(s => tacPaint(cx, c.width, c.height, s, 1)); };
    const map = TAC_MAPS[g.map_key];
    const img = new Image();
    img.onload = () => { cx.drawImage(img, 0, 0, c.width, c.height); drawMarks(); };
    img.onerror = () => { cx.fillStyle = '#0b1020'; cx.fillRect(0, 0, c.width, c.height); drawMarks(); };
    if (map) img.src = map.file; else img.onerror();
    c.onclick = () => tacGalleryPreview(g);
  });
  host.querySelectorAll('[data-glike]').forEach(b => b.onclick = async () => {
    const id = b.dataset.glike;
    if (!user) return;
    if (liked.has(id)) {
      await sb.from('tactics_gallery_likes').delete().eq('gallery_id', id).eq('user_id', user.id);
      liked.delete(id);
    } else {
      const { error: e } = await sb.from('tactics_gallery_likes').insert({ gallery_id: id, user_id: user.id });
      if (!e) {
        liked.add(id);
        const g = data.find(x => x.id === id);
        if (g && g.author_id && g.author_id !== user.id) {
          sb.from('notifications').insert({ user_id: g.author_id, type: 'like', title: 'Лайк тактики',
            body: tacNick() + ' оценил тактику «' + g.title + '»', href: 'tactics', actor_id: user.id }).then(() => {}).catch(() => {});
        }
      } else toast('Не удалось поставить лайк');
    }
    renderGallery(hostOverride);
  });
  host.querySelectorAll('[data-gpin]').forEach(b => b.onclick = async () => {
    const g = data.find(x => x.id === b.dataset.gpin);
    if (!g) return;
    const { error: e } = await sb.from('tactics_gallery').update({ pinned: !g.pinned }).eq('id', g.id);
    if (e) return toast('Не удалось изменить закрепление');
    if (!g.pinned && g.author_id && g.author_id !== user.id) {
      sb.from('notifications').insert({ user_id: g.author_id, type: 'pin', title: 'Тактика закреплена',
        body: tacNick() + ' закрепил тактику «' + g.title + '»', href: 'tactics', actor_id: user.id }).then(() => {}).catch(() => {});
    }

  host.querySelectorAll('[data-gdel]').forEach(b => b.onclick = async () => {

  const img = document.getElementById('tac_img'), cv = document.getElementById('tac_cv');

  const zlab = document.getElementById('tac_zl');
  const ZMIN = 1, ZMAX = 4;
  let live = null, raf = 0, pw = 0, ph = 0;

  const renderCapBar = () => {
    const bar = document.getElementById('tac_capbar'); if (!bar) return;
    const caps = capState();
    bar.innerHTML = `<span class="tac-mlab">Точки</span>` +
      caps.map((c, i) => `<button type="button" class="tac-cap-pill ${c.side}" data-cp="${i}" style="--cs:${(CAP_SIDES[c.side] || CAP_SIDES.neutral)[1]}" title="${CAP_SIDES[c.side][0]} · ${c.letter}"><b>${c.letter}</b></button>`).join('') +
      (editable ? `<button type="button" class="tac-cap-add" title="Сбросить все точки">＋</button>` : '');

    const add = bar.querySelector('.tac-cap-add');

      capState().length = 0;
      const m = TAC_MAPS[TAC.map];

      redraw(); renderCapBar();
    };
  };
  const drawCaps = () => {
    if (!TAC.visible || !TAC.showCaps) return;
    const W = cv.width / (cv._dpr || 1), H = cv.height / (cv._dpr || 1);
    capState().forEach((c, i) => {
      const col = (CAP_SIDES[c.side] || CAP_SIDES.neutral)[1];
      const r = Math.max(8, W * 0.020 / Math.sqrt(Math.max(1, TAC.zoom)));
      ctx.beginPath();
      ctx.rect(c.x * W - r * 0.8, c.y * H - r * 0.8, r * 1.6, r * 1.6);
      ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.5, r * .16);
      ctx.fill(); ctx.stroke();
      ctx.font = '600 ' + Math.max(10, Math.round(r * .6)) + "px 'Russo One','Exo 2',sans-serif";
      ctx.fillStyle = '#0b1020'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(i + 1), c.x * W, c.y * H + 1);
    });
  };
  const redraw = () => {
    const dpr = cv._dpr || 1, W = cv.width / dpr, H = cv.height / dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (!TAC.visible) return;
    list.forEach(s => tacPaint(ctx, W, H, s, TAC.zoom));
    drawCaps();
  };
  const clampPan = () => {
    const mx = pw * (TAC.zoom - 1) / 2, my = ph * (TAC.zoom - 1) / 2;
    TAC.px = Math.max(-mx, Math.min(mx, TAC.px));
    TAC.py = Math.max(-my, Math.min(my, TAC.py));
  };
  const applyZoom = () => {
    fit.style.transform = 'translate(' + TAC.px.toFixed(1) + 'px,' + TAC.py.toFixed(1) + 'px) scale(' + TAC.zoom + ')';
    zlab.textContent = Math.round(TAC.zoom * 100) + '%';
  };
  const resizeCanvas = () => {
    const dpr0 = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(1, pw * TAC.zoom), h = Math.max(1, ph * TAC.zoom);
    // Жёсткий лимит ~4 млн пикселей: d может быть < 1, тогда canvas
    // рисуется в меньшем разрешении и растягивается CSS — память экономится.
    const MAX = 4000000;
    let d = dpr0;
    if (w * h * d * d > MAX) d = Math.max(0.4, Math.sqrt(MAX / (w * h)));
    cv.width = Math.max(1, Math.round(w * d));
    cv.height = Math.max(1, Math.round(h * d));
    cv._dpr = d;
    redraw();
  };
  function layout() {
    const avail = Math.max(200, stage.clientWidth - 2);
    let w = avail, h = w * m.h / m.w;
    const maxH = Math.max(230, Math.round(window.innerHeight * 0.66));
    if (h > maxH) { h = maxH; w = h * m.w / m.h; }
    pw = Math.round(w); ph = Math.round(h);
    fit.style.width = pw + 'px';
    fit.style.height = ph + 'px';
    clampPan(); applyZoom(); resizeCanvas();
  }
  const zoomAt = (clientX, clientY, k) => {
    const r = cv.getBoundingClientRect();
    const z0 = TAC.zoom, z1 = Math.max(ZMIN, Math.min(ZMAX, z0 * k));
    if (Math.abs(z1 - z0) < .001) return;
    const dx = clientX - (r.left + r.width / 2), dy = clientY - (r.top + r.height / 2), f = z1 / z0;
    TAC.px = dx * (1 - f) + TAC.px * f;
    TAC.py = dy * (1 - f) + TAC.py * f;
    TAC.zoom = z1;
    clampPan(); applyZoom(); resizeCanvas();
  };
  const zoomCenter = k => { const r = cv.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, k); };
  const resetZoom = () => { TAC.px = 0; TAC.py = 0; TAC.zoom = 1; applyZoom(); resizeCanvas(); };

  const cursorFor = () => TAC.tool === 'pan' ? 'grab' : TAC.tool === 'stamp' ? 'copy' : 'crosshair';
  const ptOf = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / Math.max(1, r.width), (e.clientY - r.top) / Math.max(1, r.height)]; };
  const paintBase = () => { const dpr = cv._dpr || 1; ctx.save(); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalCompositeOperation = live.t === 'erase' ? 'destination-out' : 'source-over'; ctx.strokeStyle = live.c; ctx.fillStyle = live.c; ctx.lineWidth = Math.max(1, live.w * cv.width / dpr); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; return { W: cv.width / dpr, H: cv.height / dpr }; };
  const dot = p => { const { W, H } = paintBase(); ctx.beginPath(); ctx.arc(p[0] * W, p[1] * H, Math.max(1, ctx.lineWidth / 2), 0, 6.2832); ctx.fill(); ctx.restore(); };
  const seg = (a, b) => { const { W, H } = paintBase(); ctx.beginPath(); ctx.moveTo(a[0] * W, a[1] * H); ctx.lineTo(b[0] * W, b[1] * H); ctx.stroke(); ctx.restore(); };
  const preview = () => { redraw(); if (live) tacPaint(ctx, cv.width / (cv._dpr || 1), cv.height / (cv._dpr || 1), live, TAC.zoom); };
  let liveRaf = 0;
  window.tacPreviewLive = () => {
    if (liveRaf) return;
    liveRaf = requestAnimationFrame(() => {
      liveRaf = 0;
      preview();
      const W = cv.width / (cv._dpr || 1), H = cv.height / (cv._dpr || 1);
      Object.values(TAC_LIVE).forEach(mark => { if (mark && mark.map === TAC.map) tacPaint(ctx, W, H, mark, TAC.zoom); });
    });
  };
  const schedule = () => { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; preview(); }); };

  const stampRadius = () => Math.max(9, cv.getBoundingClientRect().width * 0.017 / Math.sqrt(TAC.zoom));
  const hitStamp = p => {
    const r = cv.getBoundingClientRect(), rad = stampRadius() * 1.9;
    let best = -1, bd = Infinity;
    for (let i = list.length - 1; i >= 0; i--) {
      const s = list[i];
      if (s.t !== 'stamp' || !s.pts || !s.pts[0]) continue;
      const d = Math.hypot((p[0] - s.pts[0][0]) * r.width, (p[1] - s.pts[0][1]) * r.height);
      if (d <= rad && d < bd) { bd = d; best = i; }
    }
    return best;
  };
  const placeStamp = p => {
    if (TAC.stamp === 'cap' && !TAC.capPlacing) {
      toast('Захват на карте «' + TAC_MAPS[TAC.map].name + '» задан автоматически — включи «Захват: вручную», чтобы ставить свой');
      return;
    }
    if (list.length >= 400) return toast('На карте уже 400 объектов — очисти лишнее');
    const s = { t: 'stamp', k: TAC.stamp, side: TAC.side, pts: [p] };
    if (TAC.stamp === 'cap') {
      const placed = list.filter(x => x.t === 'stamp' && x.k === 'cap').length;
      const auto = (TAC_MAPS[TAC.map].caps || []).length;
      s.letter = String.fromCharCode(65 + (placed + auto) % 26);
    }
    list.push(s); tacSave(); redraw(); counts();
  };

  const tacTip = () => document.getElementById('tacTip');
  const hideTacTip = () => { const t = tacTip(); if (t) t.hidden = true; };
  const showTacTip = (p, txt) => {
    const t = tacTip(); if (!t) return;
    t.hidden = false; t.textContent = txt;
    const r = cv.getBoundingClientRect();
    t.style.left = Math.min(Math.max(4, r.width - 180), p[0] * r.width + 10) + 'px';
    t.style.top = Math.max(4, p[1] * r.height - 30) + 'px';
  };
  hideTacTip();
  cv.addEventListener('pointermove', e => { hideTacTip();
    if (!TAC.visible) return;
    const idx = hitStamp(ptOf(e));
    if (idx < 0) return;
    const s = list[idx];
    const side = TAC_SIDE[s.side] ? TAC_SIDE[s.side][0] : '';
    const kk = TAC_STAMPS[s.k] ? TAC_STAMPS[s.k][0] : String(s.k);
    showTacTip(s.pts[0], kk + (side ? ' · ' + side : '') + ' · ' + Math.round(s.pts[0][0] * 100) + '% ' + Math.round(s.pts[0][1] * 100) + '%');
  });
  cv.addEventListener('pointerout', () => hideTacTip());
  cv.addEventListener('pointerdown', () => hideTacTip());
  const ptrs = new Map();
  let drag = null, pinch = null;

const IMG_MAX = 1800;
async function fileToJpegBase64(file) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, IMG_MAX / bmp.width);
  const cv = document.createElement('canvas');
  cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  return cv.toDataURL('image/jpeg', 0.88).split(',')[1];
}

const normNick = s => String(s || '').toLowerCase().replace(/[^a-zа-яё0-9]/g, '');
const stripTag = s => s.includes('_') ? s.slice(s.indexOf('_') + 1) : s;
const sameNick = (a, b) => {
  const A = normNick(a), B = normNick(b), A2 = normNick(stripTag(a)), B2 = normNick(stripTag(b));
  return !!A && !!B && (A === B || A2 === B || A === B2 || A2 === B2);
};
const toInt = v => v == null || v === '' ? null : (Number.isFinite(Number(v)) ? Math.round(Number(v)) : null);

function cleanParsed(raw) {
  const r = raw && typeof raw === 'object' ? raw : {};
  const arr = x => Array.isArray(x) ? x : [];
  return {
    team: String(r.team || '').slice(0, 40), place: toInt(r.place), team_score: toInt(r.team_score),
    timer: r.timer ? String(r.timer).slice(0, 10) : null,
    teams: arr(r.teams).slice(0, 8).map(t => ({ name: String(t.name || '').slice(0, 40), score: toInt(t.score), place: toInt(t.place) })),
    players: arr(r.players).slice(0, 60).map(p => ({ nick: String(p.nick || '').trim().slice(0, 40), kills: toInt(p.kills), deaths: toInt(p.deaths),
      assists: toInt(p.assists), score: toInt(p.score), treasury: toInt(p.treasury), rank: p.rank ? String(p.rank).slice(0, 30) : null })).filter(p => p.nick)
  };
}

function wireImport(body) {
  const err = t => { document.getElementById('shoterr').textContent = t || ''; };
  const open = async parsed => {
    const { data, error } = await sb.from('players').select('*').eq('clan_id', clan.id);
    if (error) return err(error.message);
    showImport(body, parsed, data);
  };
  document.getElementById('jsonopen').onclick = () => { const b = document.getElementById('jsonbox'); b.style.display = b.style.display === 'none' ? 'block' : 'none'; };
  document.getElementById('jsongo').onclick = () => {
    let j; try { j = JSON.parse(val('jsontxt')); } catch (e) { return err('Не получилось прочитать JSON: ' + e.message); }
    open(j);
  };
  document.getElementById('shotgo').onclick = async () => {
    const f = document.getElementById('shot').files[0];
    if (!f) return err('Выбери файл со скриншотом');
    err('');
    const b = document.getElementById('shotgo'); b.disabled = true; b.textContent = 'Распознаю…';
    try {
      const image = await fileToJpegBase64(f);
      const { data, error } = await sb.functions.invoke('parse-battle', { body: { clan_id: clan.id, image, mime: 'image/jpeg' } });
      if (error) {
        let m = error.message;
        try { const j = await error.context.json(); if (j.error) m = j.error; } catch (e) {}
        throw new Error(m);
      }
      if (data && data.error) throw new Error(data.error);
      await open(data);
    } catch (e) {
      err('Не удалось распознать: ' + e.message + '. Можно воспользоваться кнопкой «Вставить JSON» или внести бой вручную.');
      b.disabled = false; b.textContent = 'Распознать';
    }
  };
}
