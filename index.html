      data.forEach(d => ids[d.nick] = d.id);
    }
    const back = pick.filter(x => x.m && !x.m.active).map(x => x.m.id);
    if (back.length) await sb.from('players').update({ active: true }).in('id', back);
    const { data: m, error: e1 } = await sb.from('matches').insert({
      clan_id: clan.id, played_at: new Date(document.getElementById('i_dt').value).toISOString(),
      mode: val('i_mode') || null, result: txt('i_res'), place: numv('i_place'), team_score: numv('i_score'),
      extra: { source: 'screenshot', timer: cp.timer, map: val('i_map') || null, teams: cp.teams.map(t => ({ ...t, own: !!cp.team && normNick(t.name) === normNick(cp.team) })) }, created_by: user.id }).select('id').single();
    if (e1) return fail(e1.message);
    const { error: e2 } = await sb.from('match_stats').insert(pick.map(x => ({
      match_id: m.id, clan_id: clan.id, player_id: x.m ? x.m.id : ids[x.nick], nick_raw: x.nick,
      kills: num(x.r.querySelector('.k')), deaths: num(x.r.querySelector('.d')), assists: num(x.r.querySelector('.ast')), score: num(x.r.querySelector('.sc')),
      extra: { treasury: x.src.treasury, rank: x.src.rank }, confirmed: true })));
    if (e2) return fail(e2.message);
    tab = 'rating'; render();
  };
}

const EV_KIND = { tournament: 'Турнир', brawl: 'Потасовка', base: 'Захват базы', chrono: 'Хроноразломы', airdrop: 'Аирдроп', other: 'Другое' };
const ZONE_LOCATIONS = ['Тихая Заводь (Затон)', 'Дикий Север', 'Любеч-3', 'Комбинат «Уран»', 'Могильник', 'Южная', 'Северная', 'Другое'];
const AIR_ICON = {
  normal: svg(15, '<path d="M12 3v5M4 8a8 8 0 0 1 16 0M4 8l3 3M20 8l-3 3M6 11h12v9H6z"/><path d="M6 15h12"/>'),
  sugar: svg(15, '<path d="m12 2 8 5v10l-8 5-8-5V7z"/><path d="m4 7 8 5 8-5M12 12v10"/><path d="M12 2v5"/>'),
  gold: svg(15, '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 11h18M8 6V4h8v2"/><path d="M10 14h4"/>')
};
const AIRDROP_TYPES = {
  normal: { label: 'Обычный', loot: 'ресурсы локации, инструменты, компоненты, медикаменты', color: '#ffffff' },
  sugar: { label: 'Сахарный', loot: 'светящийся сахар (катализаторы, продажа)', color: '#38bdf8' },
  gold: { label: 'Золотой', loot: 'оружейный кейс, высоко ценится на рынке', color: '#fbbf24' }
};
const RSVP = { yes: 'Буду', maybe: 'Возможно', no: 'Не смогу' };
const RESULTS = { 'победа': 'Победа', 'поражение': 'Поражение', 'ничья': 'Ничья', 'не состоялось': 'Не состоялось' };
const localDt = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
const evDate = iso => new Date(iso).toLocaleString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const dayKey = d => { const x = new Date(d); return [x.getFullYear(), String(x.getMonth()+1).padStart(2,'0'), String(x.getDate()).padStart(2,'0')].join('-'); };
let calOffset = 0;
const calStart = () => { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - ((d.getDay()+6)%7) + calOffset*7); return d; };

async function viewEvents() {
  const body = document.getElementById('body');
  const start = calStart(), end = new Date(start.getTime() + 7 * 864e5);
  const [ev, mb, mt] = await Promise.all([
    sb.from('clan_events').select('*').eq('clan_id', clan.id).gte('starts_at', start.toISOString()).lt('starts_at', end.toISOString()).order('starts_at'),
    sb.from('clan_members').select('user_id,display_name').eq('clan_id', clan.id),
    sb.from('matches').select('id,result,place,played_at').eq('clan_id', clan.id)
  ]);
  const err = ev.error || mb.error || mt.error;
  if (err) return body.innerHTML = failBox(err);
  const matches = Object.fromEntries(mt.data.map(m => [m.id, m]));
  const ids = ev.data.map(e => e.id);
  const rs = ids.length ? await sb.from('event_rsvps').select('event_id,user_id,answer').in('event_id', ids) : { data: [] };
  if (rs.error) return body.innerHTML = failBox(rs.error);
  const names = Object.fromEntries(mb.data.map(m => [m.user_id, m.display_name || 'без имени']));
  const by = {}, mine = {};
  rs.data.forEach(r => {
    (by[r.event_id] = by[r.event_id] || { yes: [], maybe: [], no: [] })[r.answer].push(names[r.user_id] || 'вне клана');
    if (r.user_id === user.id) mine[r.event_id] = r.answer;
  });
  const days = Array.from({ length: 7 }, (_, i) => new Date(start.getTime() + i * 864e5));
  const weekEnd = new Date(start.getTime() + 6 * 864e5);
  const title = start.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }) + ' — ' + weekEnd.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
  const today = dayKey(new Date());
  const dayNames = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const cells = days.map((d, i) => {
    const list = ev.data.filter(e => dayKey(e.starts_at) === dayKey(d));
    return `<div class="calday ${dayKey(d) === today ? 'today' : ''}"><div class="calhead">${dayNames[i]}, ${d.getDate()}</div>` +
      (list.length ? list.map(e => `<div class="calev k-${esc(e.kind)}"><b>${new Date(e.starts_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}</b><span>${esc(e.title || EV_KIND[e.kind])}</span></div>`).join('') : '<span class="calempty">—</span>') + '</div>';
  }).join('');
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1); tomorrow.setHours(20, 0, 0, 0);
  const zoneCard = `<div class="card"><h2>События Зоны</h2>
    <p class="mut">Хроноразломы и аирдропы — регулярные события в открытом мире. Запланируй вылазку клана и добавь её в календарь.</p>
    <div class="zone-grid">
      <div class="zone-info"><h3>Хроноразломы</h3>
        <p>Хроноустановки дают хроносферу и пыль. Нужно установить установку и удержать позицию — обычно это делают отрядами.</p>
        <p class="mut">Локации: Дикий Север, Тихая Заводь (Затон), Комбинат «Уран».</p></div>
      <div class="zone-info"><h3>Аирдропы</h3>
        <p class="mut">Контейнер сбрасывается с воздуха, маркер появляется на PDA. Нужно найти его, взломать и удержать позицию — прогресс сбрасывается, если взлом начнёт другой игрок.</p>
        ${Object.entries(AIRDROP_TYPES).map(([k, a]) => `<div class="air-row"><span class="air-label"><span class="chip" style="border-color:${a.color};color:${a.color}">${AIR_ICON[k]}${esc(a.label)}</span></span><span>${esc(a.loot)}</span></div>`).join('')}
      </div>
    </div>
    ${canEdit() ? `<div class="zone-form" id="zone_form" hidden><div class="grid">
      ${fld('Тип события', '<select id="z_kind"><option value="chrono">Хроноразломы</option><option value="airdrop">Аирдроп</option></select>')}
      ${fld('Вид аирдропа', `<select id="z_atype">${selOpts(Object.fromEntries(Object.entries(AIRDROP_TYPES).map(([k, a]) => [k, a.label])), 'normal')}</select>`)}
      ${fld('Локация', `<select id="z_loc">${selOpts(Object.fromEntries(ZONE_LOCATIONS.map(x => [x, x])), ZONE_LOCATIONS[0])}</select>`)}
      ${fld('Дата и время', `<input type="datetime-local" id="z_dt" value="${localDt(tomorrow)}">`)}
      </div>${fld('Заметка (необязательно)', '<input id="z_note" maxlength="300" placeholder="Например: взять 2 отряда, позвать коллегу">')}
      <button id="z_add">Добавить в календарь</button></div>` : ''}
  </div>`;
  const form = canEdit() ? `<div class="card" id="event_form" hidden><h2>Новое событие</h2><div class="grid">
    ${fld('Тип', `<select id="e_kind">${selOpts(EV_KIND, 'tournament')}</select>`)}${fld('Название (необязательно)', '<input id="e_title" maxlength="120">')}
    ${fld('Дата и время', `<input type="datetime-local" id="e_dt" value="${localDt(tomorrow)}">`)}
    ${fld('Повтор', `<select id="e_repeat"><option value="once">Не повторяется</option><option value="daily">Каждый день</option><option value="weekly">Каждую неделю</option><option value="weekdays">По будням (пн–пт)</option></select>`)}
    ${fld('Дни недели', `<div class="day-picks" id="e_days" hidden>${['вс','пн','вт','ср','чт','пт','сб'].map((d, i) => `<button type="button" data-day="${i}" class="${i === new Date(tomorrow).getDay() ? 'on' : ''}">${d}</button>`).join('')}</div>`)}</div>
    <p class="mut next-date" id="e_next"></p>
    ${fld('Заметка (необязательно)', '<textarea id="e_note" maxlength="500"></textarea>')}<button id="e_add">Создать</button></div>` : '';
  const card = e => {
    const g = by[e.id] || { yes: [], maybe: [], no: [] };
    const link = e.match_id && matches[e.match_id];
    const resSel = `<select id="res_${e.id}">${selOpts(RESULTS, link ? link.result : '', '—')}</select>`;
    const resultBlock = link
      ? `<p>Результат: <b>${esc(link.result || ('место ' + (link.place || '—')))}</b></p><div class="row">${resSel}<button class="ghost" data-res="${e.id}" data-mid="${link.id}">Обновить</button></div>`
      : (new Date(e.starts_at) <= new Date() && canEdit()
          ? `<div class="row">${resSel}<button class="ghost" data-res="${e.id}">Записать результат</button></div>` : '');
    const dayNames = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
    const rep = { daily: 'каждый день', weekly: 'каждую неделю' + ((e.repeat_days || []).length ? ' (' + e.repeat_days.map(d => dayNames[Number(d)]).join(', ') + ')' : ''), weekdays: 'по будням' }[e.repeat_rule];
    return `<div class="card"><div class="rtitle"><span class="chip ok">${EV_KIND[e.kind]}</span><b>${esc(e.title)}</b>${rep ? `<span class="chip">↻ ${rep}</span>` : ''}</div>
      <p class="mut">${evDate(e.starts_at)}</p>${e.location ? `<p class="mut">Локация: ${esc(e.location)}</p>` : ''}${e.note ? `<p>${esc(e.note)}</p>` : ''}
      <p>Буду: <b>${g.yes.length}</b> · Возможно: <b>${g.maybe.length}</b> · Не смогу: <b>${g.no.length}</b></p>
      <div class="row">${Object.entries(RSVP).map(([k, l]) => `<button class="ghost ${mine[e.id] === k ? 'on' : ''}" data-rsvp="${e.id}|${k}">${l}</button>`).join('')}</div>
      ${resultBlock}
      <details><summary class="mut">Кто что ответил</summary>${Object.entries(RSVP).map(([k, l]) => `<p><b>${l}:</b> ${g[k].length ? g[k].map(n => esc(n)).join(', ') : '—'}</p>`).join('')}</details>
      ${canEdit() ? `<div class="row" style="margin-top:8px"><button class="ghost" data-delev="${e.id}">Отменить событие</button>${e.series_id ? `<button class="ghost" data-delseries="${e.series_id}">Отменить серию</button>` : ''}</div>` : ''}</div>`;
  };
  body.innerHTML = pgHead('События', 'Календарь клана, хроноразломы и аирдропы — планируй вылазки заранее.',
      canEdit() ? `<button class="ghost" id="ev_new">Новое событие</button><button class="ghost" id="ev_zone">Вылазка в Зону</button>` : '')
    + `<div class="card"><div class="top"><h2 style="margin:0">Календарь клана</h2><span class="row">
    <button class="ghost" data-cal="-1">←</button><button class="ghost" data-cal="0">Сегодня</button><button class="ghost" data-cal="1">→</button></span></div>
    <p class="mut">${title}. Напоминание придёт за день до события.</p><div class="calgrid">${cells}</div></div>
    ${zoneCard}
    ${form}
    ${ev.data.length ? ev.data.map(card).join('') : `<div class="card empty"><div class="eico">${ICONS.cal}</div><h3>На этой неделе событий нет</h3><p>Листай календарь стрелками или создай событие — клан получит напоминание.</p></div>`}`;
  const toggleForm = (id, btn) => {
    const el = document.getElementById(id); if (!el) return;
    el.hidden = !el.hidden;
    if (!el.hidden) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (btn) btn.classList.toggle('on', !el.hidden);
  };
  const evn = document.getElementById('ev_new');
  if (evn) evn.onclick = () => toggleForm('event_form', evn);
  const evz = document.getElementById('ev_zone');
  if (evz) evz.onclick = () => toggleForm('zone_form', evz);
  const repSel = document.getElementById('e_repeat'), dayBox = document.getElementById('e_days'), nextEl = document.getElementById('e_next'), dtEl = document.getElementById('e_dt');
  const pickedDays = () => [...(dayBox ? dayBox.querySelectorAll('button.on') : [])].map(b => Number(b.dataset.day));
  const nextDate = (base, rule, days) => {
    const d = new Date(base);
    if (rule === 'once' || !rule) return d;
    if (rule === 'daily') { d.setDate(d.getDate() + 1); return d; }
    for (let i = 0; i < 7; i++) {
      d.setDate(d.getDate() + 1);
      const w = d.getDay();
      if (rule === 'weekdays' ? (w >= 1 && w <= 5) : (days.length ? days.includes(w) : w === base.getDay())) return d;
    }
    return d;
  };
  const updNext = () => {
    if (!repSel || !nextEl || !dtEl) return;
    const rule = repSel.value, days = pickedDays();
    if (dayBox) dayBox.hidden = rule !== 'weekly';
    if (!dtEl.value) { nextEl.textContent = ''; return; }
    const d = nextDate(new Date(dtEl.value), rule, days);
    nextEl.textContent = rule === 'once' ? 'Событие состоится один раз.' : 'Следующее событие: ' + evDate(d.toISOString());
  };
  if (repSel) repSel.onchange = updNext;
  if (dtEl) dtEl.onchange = updNext;
  if (dayBox) dayBox.querySelectorAll('button').forEach(b => b.onclick = () => { b.classList.toggle('on'); updNext(); });
  updNext();
  body.querySelectorAll('[data-cal]').forEach(b => b.onclick = () => {
    const v = Number(b.dataset.cal); calOffset = v === 0 ? 0 : calOffset + v;
    const y = scrollY; viewEvents().then(() => scrollTo(0, y));
  });
  const zk = document.getElementById('z_kind');
  if (zk) {
    const syncZone = () => {
      const wrap = document.getElementById('z_atype').closest('label');
      wrap.style.display = zk.value === 'airdrop' ? '' : 'none';
    };
    zk.onchange = syncZone; syncZone();
  }
  const za = document.getElementById('z_add');
  if (za) za.onclick = async () => {
    const kind = val('z_kind'), atype = val('z_atype'), loc = val('z_loc'), dt = val('z_dt');
    if (!dt) return alert('Укажи дату и время');
    const info = kind === 'chrono'
      ? { title: 'Хроноразломы · ' + loc, note: 'Хроноустановка: хроносфера и пыль. Нужно установить и удержать позицию. Локация: ' + loc }
      : { title: AIRDROP_TYPES[atype].label + ' дроп · ' + loc,
          note: AIRDROP_TYPES[atype].loot + '. Локация: ' + loc };
    const extra = txt('z_note');
    const { error } = await sb.from('clan_events').insert({
      clan_id: clan.id, kind, title: info.title, starts_at: new Date(dt).toISOString(),
      note: info.note + (extra ? '\n' + extra : ''), location: loc, created_by: user.id
    });
    if (error) return alert(error.message);
    calOffset = 0; viewEvents();
  };
  const add = document.getElementById('e_add');
  if (add) add.onclick = async () => {
    const kind = val('e_kind'), dt = val('e_dt'), rule = val('e_repeat') || 'once';
    if (!dt) return alert('Укажи дату и время');
    const base = new Date(dt), dates = [], days = pickedDays();
    if (rule === 'once') dates.push(new Date(base));
    else {
      const limit = new Date(base); limit.setDate(limit.getDate() + 84);
      for (let d = new Date(base); d <= limit; d.setDate(d.getDate() + 1)) {
        const day = d.getDay();
        if (rule === 'daily' || (rule === 'weekly' && (days.length ? days.includes(day) : day === base.getDay())) || (rule === 'weekdays' && day >= 1 && day <= 5)) dates.push(new Date(d));
      }
    }
    const series = rule === 'once' ? null : (crypto && crypto.randomUUID ? crypto.randomUUID() : 's' + Date.now());
    const rows = dates.map(d => ({ clan_id: clan.id, kind, title: txt('e_title') || EV_KIND[kind],
      starts_at: d.toISOString(), note: txt('e_note'), created_by: user.id, repeat_rule: rule, repeat_days: rule === 'weekly' ? days.map(String) : [], series_id: series }));
    const { error } = await sb.from('clan_events').insert(rows);
    if (error) return alert(error.message);
    auditLog('событие', (EV_KIND[kind] || '') + (rule !== 'once' ? ' · повтор: ' + rule + ' (' + dates.length + ')' : ''));
    calOffset = 0; viewEvents();
  };
  body.querySelectorAll('[data-rsvp]').forEach(b => b.onclick = async () => {
    const [eid, ans] = b.dataset.rsvp.split('|');
    const { error } = await sb.from('event_rsvps').upsert({ event_id: eid, user_id: user.id, answer: ans, updated_at: new Date().toISOString() }, { onConflict: 'event_id,user_id' });
    if (error) return alert(error.message);
    const y = scrollY; await viewEvents(); scrollTo(0, y);
  });
  body.querySelectorAll('[data-res]').forEach(b => b.onclick = async () => {
    const eid = b.dataset.res, mid = b.dataset.mid || null;
    const result = document.getElementById('res_' + eid).value;
    if (!result) return alert('Выбери результат');
    const event = ev.data.find(x => x.id === eid);
    if (mid) {
      const { error } = await sb.from('matches').update({ result }).eq('id', mid);
      if (error) return alert(error.message);
    } else {
      const { data: m, error: e1 } = await sb.from('matches').insert({ clan_id: clan.id, played_at: event.starts_at, result, mode: EV_KIND[event.kind], created_by: user.id }).select('id').single();
      if (e1) return alert(e1.message);
      const { error: e2 } = await sb.from('clan_events').update({ match_id: m.id }).eq('id', eid);
      if (e2) return alert(e2.message);
    }
    const y = scrollY; await viewEvents(); scrollTo(0, y);
  });
  body.querySelectorAll('[data-delev]').forEach(b => b.onclick = async () => {
    if (!confirm('Отменить это событие? Остальные в серии останутся.')) return;
    const { error } = await sb.from('clan_events').delete().eq('id', b.dataset.delev);
    if (error) return alert(error.message);
    const y = scrollY; await viewEvents(); scrollTo(0, y);
  });
  body.querySelectorAll('[data-delseries]').forEach(b => b.onclick = async () => {
    if (!confirm('Отменить всю серию событий навсегда?')) return;
    const { error } = await sb.from('clan_events').delete().eq('series_id', b.dataset.delseries);
    if (error) return alert(error.message);
    const y = scrollY; await viewEvents(); scrollTo(0, y);
  });
}
MAXIMIZE.on();
const registerAuth = () => {
  if (sb && sb.auth && typeof sb.auth.onAuthStateChange === 'function') {
    sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') showLanding(); });
  }
};
const bootApp = () => {
  if (!sb && !sbInit()) return false;
  registerAuth();
  try {
    Promise.race([
      init(),
      new Promise(r => setTimeout(() => {
        if (!document.querySelector('.land, .app')) showLanding('Не удалось быстро подключиться. Проверь интернет и обнови страницу.');
      }, 6000))
    ]).catch(e => { console.error(e); showLanding('Ошибка запуска: ' + (e && e.message ? e.message : 'неизвестная')); });
  } catch (e) { showLanding('Ошибка запуска: ' + (e && e.message ? e.message : 'неизвестная')); }
  return true;
};
if (window.supabase) bootApp();
else window.addEventListener('cp-lib-ready', () => { if (!bootApp()) showLanding('Библиотека входа не загрузилась. Проверь соединение.'); }, { once: true });
setTimeout(() => { if (!document.querySelector('.land, .app')) showLanding('Сайт отвечает медленно — попробуй обновить страницу.'); }, 10000);
</script>
