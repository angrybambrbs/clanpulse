<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f0f23">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>ClanPulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f23;--card:#181634;--tx:#e8eaf6;--mut:#9aa3c7;--ac:#8b5cf6;--ac2:#a78bfa;--ac-rgb:139,92,246;--btn1:#7c3aed;--btn2:#6d28d9;--cta:#e11d48;--bd:#2c2854;--bd2:#3d376e;--bad:#f87171;--in:#121026;--in2:#0d0b1e;--ok:#34d399;--warn:#fbbf24;--warn-bg:rgba(251,191,36,.12);--bad-bg:rgba(248,113,113,.12);--ring:rgba(var(--ac-rgb),.35);--glow:0 0 18px rgba(var(--ac-rgb),.35);--shadow:0 8px 24px rgba(5,4,18,.4);--g1:rgba(var(--ac-rgb),.16);--g2:rgba(244,63,94,.07)}
[data-theme="light"]{--bg:#f4f3fa;--card:#fff;--tx:#201d2b;--mut:#67617d;--ac:#7c3aed;--ac2:#6d28d9;--ac-rgb:124,58,237;--cta:#be123c;--bd:#ddd8ea;--bd2:#c9c2de;--bad:#dc2626;--in:#fff;--in2:#f2f0f8;--ok:#059669;--warn:#b45309;--warn-bg:rgba(245,158,11,.14);--bad-bg:rgba(220,38,38,.10);--ring:rgba(var(--ac-rgb),.22);--glow:0 4px 14px rgba(var(--ac-rgb),.22);--shadow:0 6px 18px rgba(32,29,43,.08);--g1:rgba(var(--ac-rgb),.07);--g2:rgba(244,63,94,.05)}
[data-accent="ocean"]{--bg:#061426;--card:#0a1c33;--tx:#e6eef9;--mut:#8aa0c2;--ac:#3b82f6;--ac2:#60a5fa;--ac-rgb:59,130,246;--btn1:#2563eb;--btn2:#1d4ed8;--cta:#e11d48;--bd:#1c2f4d;--bd2:#2a4166;--bad:#f87171;--in:#07101f;--in2:#050b16;--ok:#34d399;--warn:#fbbf24;--warn-bg:rgba(251,191,36,.12);--bad-bg:rgba(248,113,113,.12);--ring:rgba(59,130,246,.35);--glow:0 0 18px rgba(59,130,246,.35);--shadow:0 8px 24px rgba(2,8,20,.55);--g1:rgba(59,130,246,.16);--g2:rgba(244,63,94,.07)}
[data-accent="ocean"][data-theme="light"]{--bg:#eaf2fc;--card:#ffffff;--tx:#16233c;--mut:#4d6a92;--ac:#1d4ed8;--ac2:#1e40af;--ac-rgb:29,78,216;--btn1:#1d4ed8;--btn2:#1e3a8a;--cta:#be123c;--bd:#c9d8ef;--bd2:#a9c2e6;--bad:#dc2626;--in:#ffffff;--in2:#f2f8ff;--ok:#059669;--warn:#b45309;--warn-bg:rgba(245,158,11,.14);--bad-bg:rgba(220,38,38,.10);--ring:rgba(29,78,216,.22);--glow:0 4px 14px rgba(29,78,216,.2);--shadow:0 6px 18px rgba(32,29,43,.08);--g1:rgba(29,78,216,.07);--g2:rgba(244,63,94,.05)}
[data-accent="emerald"]{--bg:#07120e;--card:#0b1f18;--tx:#e7f5ee;--mut:#8fb3a4;--ac:#10b981;--ac2:#34d399;--ac-rgb:16,185,129;--btn1:#059669;--btn2:#047857;--cta:#e11d48;--bd:#14352a;--bd2:#1f4a3c;--bad:#f87171;--in:#08120d;--in2:#050c09;--ok:#34d399;--warn:#fbbf24;--warn-bg:rgba(251,191,36,.12);--bad-bg:rgba(248,113,113,.12);--ring:rgba(16,185,129,.35);--glow:0 0 18px rgba(16,185,129,.35);--shadow:0 8px 24px rgba(2,10,7,.5);--g1:rgba(16,185,129,.16);--g2:rgba(244,63,94,.07)}
[data-accent="emerald"][data-theme="light"]{--bg:#eaf7f0;--card:#ffffff;--tx:#10332a;--mut:#3f6b5d;--ac:#047857;--ac2:#065f46;--ac-rgb:4,120,87;--btn1:#047857;--btn2:#065f46;--cta:#be123c;--bd:#c8e4d8;--bd2:#a3d2bf;--bad:#dc2626;--in:#ffffff;--in2:#f2faf6;--ok:#059669;--warn:#b45309;--warn-bg:rgba(245,158,11,.14);--bad-bg:rgba(220,38,38,.10);--ring:rgba(4,120,87,.22);--glow:0 4px 14px rgba(4,120,87,.18);--shadow:0 6px 18px rgba(32,29,43,.08);--g1:rgba(4,120,87,.07);--g2:rgba(244,63,94,.05)}
[data-accent="amber"]{--bg:#170f02;--card:#221705;--tx:#faf0de;--mut:#c8ab7e;--ac:#f59e0b;--ac2:#fbbf24;--ac-rgb:245,158,11;--btn1:#b45309;--btn2:#92400e;--cta:#e11d48;--bd:#3a2a12;--bd2:#4a3416;--bad:#f87171;--in:#181006;--in2:#120b04;--ok:#34d399;--warn:#fbbf24;--warn-bg:rgba(251,191,36,.12);--bad-bg:rgba(248,113,113,.12);--ring:rgba(245,158,11,.35);--glow:0 0 18px rgba(245,158,11,.35);--shadow:0 8px 24px rgba(20,10,2,.55);--g1:rgba(245,158,11,.16);--g2:rgba(244,63,94,.07)}
[data-accent="amber"][data-theme="light"]{--bg:#fdf3e3;--card:#ffffff;--tx:#3d2a10;--mut:#7a5c34;--ac:#b45309;--ac2:#92400e;--ac-rgb:180,83,9;--btn1:#b45309;--btn2:#92400e;--cta:#be123c;--bd:#f0ddb8;--bd2:#e3c48c;--bad:#dc2626;--in:#ffffff;--in2:#fdf8ee;--ok:#059669;--warn:#b45309;--warn-bg:rgba(245,158,11,.14);--bad-bg:rgba(220,38,38,.10);--ring:rgba(180,83,9,.22);--glow:0 4px 14px rgba(180,83,9,.16);--shadow:0 6px 18px rgba(32,29,43,.08);--g1:rgba(180,83,9,.07);--g2:rgba(244,63,94,.05)}
[data-accent="custom"]:not([data-theme="light"]){--bg:#0b1020;--card:#12172c;--in:#0d1226;--in2:#080d1c;--bd:#2c2854;--bd2:#3d376e}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--bd2) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
::selection{background:rgba(var(--ac-rgb),.45)}
body{margin:0;font:16px/1.5 'Exo 2',system-ui,sans-serif;background:radial-gradient(1000px 520px at 85% -140px,var(--g1),transparent 60%),radial-gradient(800px 420px at -120px 35vh,var(--g2),transparent 55%),var(--bg);background-attachment:fixed;color:var(--tx)}
main{max-width:880px;margin:0 auto;padding:16px}
h1,h2{font-family:'Russo One','Exo 2',system-ui,sans-serif;font-weight:400;letter-spacing:.3px}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:0 0 12px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0) 46px),var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow);animation:rise .25s ease-out both}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px}
.tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border-radius:999px}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:8px;padding:8px 12px}
button{cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--btn1),var(--btn2));border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 14px;font-weight:600;transition:transform .15s ease,box-shadow .15s ease,filter .15s ease,color .15s ease,border-color .15s ease,background-color .15s ease}
button:hover{filter:brightness(1.08);box-shadow:var(--glow);transform:translateY(-1px)}
button:active{transform:translateY(0);filter:brightness(.96)}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ring)}
button.ghost{background:transparent;border-color:var(--bd);color:var(--mut)}
button.ghost:hover{border-color:var(--ac);color:var(--tx);box-shadow:none;filter:none}
button.ghost.on{border-color:var(--ac);color:var(--tx);background:rgba(var(--ac-rgb),.15);box-shadow:inset 0 0 0 1px rgba(var(--ac-rgb),.35)}
textarea{width:100%;min-height:120px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap;transition:background-color .15s ease}
table.t-table td:nth-child(5){white-space:normal;overflow-wrap:anywhere;max-width:280px;min-width:0}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
tr:hover td{background:rgba(var(--ac-rgb),.07)}
td input[type=number]{width:80px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.dim td{color:var(--mut)}
.hero{max-width:520px;margin:10vh auto 0;padding:0 16px;text-align:center}
.logo{font-weight:700;letter-spacing:.5px;margin-bottom:12px;font-family:'Russo One','Exo 2',sans-serif;background:linear-gradient(90deg,var(--ac2),var(--cta));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1{font-size:28px;line-height:1.2;margin-bottom:10px}
.feats{list-style:none;padding:0;margin:20px 0;text-align:left;display:inline-block}
.feats li{padding:6px 0 6px 24px;position:relative}
.feats li:before{content:"✓";position:absolute;left:0;color:var(--ac2)}
button.discord{background:#5865f2;border-color:#5865f2;font-size:16px;padding:12px 24px}
button.discord:hover{box-shadow:0 0 18px rgba(88,101,242,.5)}
button:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none;filter:none}
.me{display:flex;align-items:center;gap:8px;color:var(--mut)}
.me img{width:28px;height:28px;border-radius:50%}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fld span{color:var(--mut);font-size:13px}
.fld input,.fld select,.fld textarea{width:100%}
.fld textarea{min-height:80px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 12px}
.chk{display:inline-flex;gap:6px;align-items:center;margin:0 14px 10px 0}
.card p{margin:4px 0}
.av{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none}
.brand{display:flex;align-items:center;gap:10px}
.av.sm{width:28px;height:28px;border-radius:50%}
.log{max-height:55vh;overflow-y:auto;margin-bottom:10px}
.msg{padding:8px 0;border-bottom:1px solid var(--bd)}
.msg p{margin:4px 0 0;white-space:pre-wrap;word-break:break-word}
.msg .x{margin-left:auto;padding:2px 8px}
.conv{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer;border-radius:8px;transition:background-color .15s ease;min-height:34px;padding:10px 0 10px}
.conv:focus-visible,.crow:focus-visible,.bestyles:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
.conv:hover{background:rgba(var(--ac-rgb),.08)}
.badge{background:linear-gradient(135deg,var(--cta),var(--btn1));color:#fff;border-radius:10px;padding:0 7px;font-size:12px;font-weight:700}
.badge:empty{display:none}
.topr{display:flex;gap:8px;align-items:center;flex:none}
.top .brand{min-width:0}
.top h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avb{padding:4px 8px}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(300px,85vw);background:var(--card);border-right:1px solid var(--bd);padding:16px;transform:translateX(-105%);transition:transform .2s;z-index:20;overflow-y:auto;box-shadow:24px 0 60px rgba(0,0,0,.5)}
.drawer.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(10,8,24,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.scrim.open{opacity:1;pointer-events:auto}
.navi{display:flex;justify-content:space-between;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:0;border-radius:10px;padding:10px 12px;color:var(--tx);font-weight:500}
.navi:hover{background:var(--in);color:var(--ac2);box-shadow:none;transform:none;filter:none}
.navi.on{background:rgba(var(--ac-rgb),.15);color:var(--ac2)}
.grp{margin:14px 0 6px;font-size:13px}
#cmsg,#dmsg{min-height:56px}
.sbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.sbar .sq{flex:1 1 180px;min-width:0}
.sbasic{flex-basis:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sbasic select{width:100%;min-width:0;padding:8px 6px;font-size:13px}
.clist{display:grid;gap:10px}
.crow{display:flex;gap:12px;align-items:center;cursor:pointer;margin:0;transition:background-color .15s ease;min-height:34px}
.crow:hover{filter:brightness(1.08)}
.crow .meta{flex:1;min-width:0}
.rtitle{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:2px}
.chip{display:inline-block;border:1px solid var(--bd);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--mut);margin:0 6px 6px 0;transition:border-color .15s ease,color .15s ease}
a.chip{text-decoration:none}
a.chip:hover{border-color:var(--ac);color:var(--tx)}
.chip.ok{border-color:var(--ac);color:var(--tx);background:rgba(var(--ac-rgb),.12)}
.av.ph{display:flex;align-items:center;justify-content:center;background:var(--in2);color:var(--mut);font-weight:600}
.av.lg{width:72px;height:72px;border-radius:14px;font-size:22px}
.okc{color:var(--ac2)}
.gsets{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
button.sm{padding:4px 10px;font-size:13px}
.gcard{background:var(--in);border:1px solid var(--bd);border-radius:12px;padding:12px;min-width:0;transition:border-color .15s ease}
.gcard:hover{border-color:var(--bd2)}
.gcard .gtile{background:transparent;border:0;padding:0}
.cstats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
.cs{background:var(--in2);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;min-width:0}
.cs span{display:block;color:var(--mut);font-size:11px}
.cs b{font-family:'Russo One','Exo 2',sans-serif;font-weight:400;font-size:14px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.slot{position:relative;border:1px dashed var(--bd2);border-radius:8px;min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;text-align:center;font-size:11px;word-break:break-word}
.slot.edit{cursor:pointer;transition:border-color .15s ease,background-color .15s ease}
.slot.edit:hover{border-color:var(--ac);background:rgba(var(--ac-rgb),.06)}
.slot .x{position:absolute;top:2px;right:2px;padding:0 6px;font-size:12px;line-height:18px}
.gi.sm{width:34px;height:34px}
.gtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.gtile{display:flex;gap:10px;align-items:center;background:var(--in);border:1px solid var(--bd);border-radius:12px;padding:10px;min-width:0}
.gi{width:52px;height:52px;object-fit:contain;flex:none;border-radius:8px;background:var(--in2)}
.gi.ph{display:flex;align-items:center;justify-content:center;color:var(--mut)}
.prow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);cursor:pointer;transition:background-color .15s ease}
.prow:hover{background:rgba(var(--ac-rgb),.06)}
.cdet{padding:0 0 10px 58px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.stat{background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:10px;transition:border-color .15s ease}
.stat:hover{border-color:var(--bd2)}
.stat b{display:block;font-family:'Russo One','Exo 2',sans-serif;font-weight:400;font-size:20px}
.stat span{color:var(--mut);font-size:12px}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:88vh;overflow-y:auto;background:var(--card);border:1px solid var(--bd);border-radius:16px 16px 0 0;padding:16px;transform:translateY(105%);transition:transform .2s;z-index:30;box-shadow:0 -20px 60px rgba(0,0,0,.55)}
.sheet.open{transform:none}
.sheet h3{margin:14px 0 8px;font-size:14px;color:var(--mut);font-weight:600}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.sfoot{position:sticky;bottom:-16px;background:var(--card);padding:12px 0 0;display:flex;gap:8px;justify-content:space-between}
a{color:var(--ac2)}
a:hover{color:var(--ac)}
.mut{color:var(--mut)}.err{color:var(--bad)}
.faction.svoboda{color:#f87171;border-color:#f87171;background:rgba(248,113,113,.10)}
.faction.dolg{color:#60a5fa;border-color:#60a5fa;background:rgba(96,165,250,.10)}
.faction.naemniki{color:#fbbf24;border-color:#fbbf24;background:rgba(251,191,36,.10)}
.faction.zavet{color:#a78bfa;border-color:#a78bfa;background:rgba(167,139,250,.10)}
.warnrow td{background:var(--warn-bg)}.badrow td{background:var(--bad-bg)}
.att{font-size:12px;white-space:normal}.chart text{fill:var(--mut);font-size:10px}
.topcard{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(96px,1fr));gap:6px;overflow-x:auto}
.calday{background:var(--in);border:1px solid var(--bd);border-radius:8px;padding:8px;min-height:92px;transition:border-color .15s ease}
.calday.today{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac),0 0 14px rgba(var(--ac-rgb),.25)}
.calhead{font-size:12px;color:var(--mut);margin-bottom:6px}
.calev{font-size:12px;background:var(--card);border-radius:6px;padding:4px 6px;margin-bottom:4px;overflow-wrap:anywhere;transition:background-color .15s ease}
.calev:hover{background:var(--in2)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.crow,.gcard,.gtile,.stat,.calev{animation:rise .28s ease-out both}
.crow:nth-child(2),.gcard:nth-child(2),.gtile:nth-child(2),.stat:nth-child(2){animation-delay:.035s}
.crow:nth-child(3),.gcard:nth-child(3),.gtile:nth-child(3),.stat:nth-child(3){animation-delay:.07s}
.crow:nth-child(4),.gcard:nth-child(4),.gtile:nth-child(4),.stat:nth-child(4){animation-delay:.105s}
.crow:nth-child(5),.gcard:nth-child(5),.gtile:nth-child(5),.stat:nth-child(5){animation-delay:.14s}
.crow:nth-child(6),.gcard:nth-child(6),.gtile:nth-child(6),.stat:nth-child(6){animation-delay:.175s}
.crow:nth-child(7),.gcard:nth-child(7),.gtile:nth-child(7),.stat:nth-child(7){animation-delay:.21s}
.crow:nth-child(8),.gcard:nth-child(8),.gtile:nth-child(8),.stat:nth-child(8){animation-delay:.245s}
.crow:nth-child(n+9),.gcard:nth-child(n+9),.gtile:nth-child(n+9),.stat:nth-child(n+9){animation-delay:.28s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.prow{display:flex;gap:8px;align-items:center;padding:3px 0;border-bottom:1px solid var(--bd)}

/* ===== Каркас: сайдбар + топбар ===== */
#app{max-width:none;margin:0;padding:0}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh;align-items:start}
.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:12px;padding:16px 12px;background:linear-gradient(180deg,rgba(var(--ac-rgb),.11),transparent 240px),var(--in2);border-right:1px solid var(--bd);overflow-y:auto;z-index:6}
[data-theme="light"] .sidebar{background:linear-gradient(180deg,rgba(var(--ac-rgb),.05),transparent 240px),var(--card)}
.side-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 12px;border-bottom:1px solid var(--bd);min-width:0}
.side-brand .av{width:38px;height:38px;border-radius:11px;box-shadow:0 0 0 1px var(--bd2),0 0 16px rgba(var(--ac-rgb),.25)}
.side-brand span{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:700}
.side-brand b{display:block;font-family:'Russo One','Exo 2',sans-serif;font-weight:400;font-size:15px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clan-link{cursor:pointer}
.clan-link:hover b,.clan-link:hover{color:var(--ac2)}
.side-nav{flex:1;display:flex;flex-direction:column;gap:2px;min-height:0;overflow-y:auto;scrollbar-width:thin}
.side-sec{padding:12px 10px 4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:700;opacity:.8}
.side-foot{flex:none;border-top:1px solid var(--bd);padding-top:10px;display:flex;flex-direction:column;gap:2px;margin-top:auto}
.tac-vtools{display:flex;flex:none;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--bd);border-radius:14px;background:linear-gradient(180deg,rgba(var(--ac-rgb),.07),transparent 130px),var(--in);align-self:start;position:sticky;top:76px}
.tac-vtools .tac-sec{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:700;margin:0 0 2px}
.tac-work{display:grid;grid-template-columns:132px minmax(0,1fr);gap:14px;align-items:start}
.acc-row{display:flex;align-items:center;gap:7px;padding:6px 4px 4px}
.acc-row .alab{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-right:2px}
.acsw{width:24px;height:24px;min-height:0;padding:0;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px var(--bd2);background:var(--sw);transform:none}
.acsw-custom{position:relative;overflow:hidden;background:conic-gradient(#f43f5e,#f59e0b,#10b981,#3b82f6,#8b5cf6,#f43f5e)}
.acsw-custom input{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);padding:0;border:0;background:transparent;opacity:0;cursor:pointer}
.acsw:hover{transform:scale(1.12);box-shadow:0 0 0 1px var(--bd2);filter:none}
.acsw.on{border-color:var(--card);box-shadow:0 0 0 2px var(--tx)}
.sidebar .navi,.drawer .navi{padding:9px 10px;font-size:14px}
.navi .nlabel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navi .badge{margin-left:6px}
.navi.on{background:linear-gradient(90deg,rgba(var(--ac-rgb),.22),rgba(var(--ac-rgb),.04));box-shadow:inset 0 0 0 1px rgba(var(--ac-rgb),.28)}
.navi.on svg{color:var(--ac2)}
.main{display:flex;flex-direction:column;min-width:0;min-height:100vh}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:11px clamp(14px,3vw,28px);background:linear-gradient(90deg,rgba(var(--ac-rgb),.16),rgba(var(--ac-rgb),.03) 55%),var(--bg);backdrop-filter:blur(14px);border-bottom:1px solid rgba(var(--ac-rgb),.32);box-shadow:0 4px 18px rgba(var(--ac-rgb),.08)}
[data-theme="light"] .topbar{background:linear-gradient(90deg,rgba(var(--ac-rgb),.10),rgba(var(--ac-rgb),.02) 55%),var(--bg)}
.tb-title{flex:1;min-width:0}
.tb-kicker{display:block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title h1{font-size:20px;line-height:1.2;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-actions{display:flex;align-items:center;gap:4px;flex:none}
.tb-actions .ghost{display:inline-flex;align-items:center;gap:6px;padding:7px 9px;border-radius:9px;line-height:1}
.tb-actions .avb{padding:3px 6px}
.content{width:100%;max-width:1220px;margin:0 auto;padding:16px clamp(14px,3vw,28px) 56px}
.tabs{width:100%;max-width:1220px;margin:0 auto;padding:14px clamp(14px,3vw,28px) 0}
.mob{display:none}

/* ===== Дашборд ===== */
.dash-hero{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(var(--ac-rgb),.18),rgba(225,29,72,.06) 55%,transparent),var(--card);border:1px solid var(--bd2);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.dash-hero:before{content:"";position:absolute;top:-45%;right:-8%;width:340px;height:340px;background:radial-gradient(circle,rgba(var(--ac-rgb),.28),transparent 65%);pointer-events:none}
.dh-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px;position:relative}
.dh-kicker{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ac2);font-weight:700;margin-bottom:4px}
.dash-hero h2{font-size:22px;margin:0}
.dh-mark{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ac2);background:rgba(var(--ac-rgb),.12);border:1px solid rgba(var(--ac-rgb),.32);box-shadow:var(--glow)}
.dh-top .pg-actions button{min-width:auto}
.hero-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;position:relative}
.hstat{background:rgba(9,8,22,.35);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;min-width:0}
[data-theme="light"] .hstat{background:rgba(var(--ac-rgb),.04)}
.hstat span{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:700}
.hstat b{display:block;font-family:'Russo One','Exo 2',sans-serif;font-weight:400;font-size:24px;line-height:1.25;margin:2px 0}
.hstat i{display:block;font-style:normal;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.pod{position:relative;display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);box-shadow:none;font-weight:500;transform:none}
.pod:hover{transform:translateY(-1px);box-shadow:var(--glow)}
.pod .medal{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:'Russo One','Exo 2',sans-serif;font-size:14px;background:var(--in2);border:1px solid var(--bd2);color:var(--mut)}
.pod.p1{border-color:rgba(250,204,21,.5);background:linear-gradient(135deg,rgba(250,204,21,.12),var(--card) 60%)}
.pod.p1 .medal{background:linear-gradient(135deg,#facc15,#f59e0b);color:#201a04;border-color:transparent;box-shadow:0 0 14px rgba(250,204,21,.35)}
.pod.p2{border-color:rgba(203,213,225,.45)}
.pod.p2 .medal{background:linear-gradient(135deg,#e2e8f0,#94a3b8);color:#1a2030;border-color:transparent}
.pod.p3{border-color:rgba(251,146,60,.45)}
.pod.p3 .medal{background:linear-gradient(135deg,#fdba74,#c2410c);color:#2a1204;border-color:transparent}
.pod .pn{flex:1;min-width:0}
.pod .pn b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.pod .pn span{display:block;font-size:11px;color:var(--mut)}
.place{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:8px;background:var(--in2);border:1px solid var(--bd);font-family:'Russo One','Exo 2',sans-serif;font-size:12px;color:var(--mut)}
.place.p1{background:linear-gradient(135deg,#facc15,#f59e0b);border-color:transparent;color:#201a04;box-shadow:0 0 10px rgba(250,204,21,.3)}
.place.p2{background:linear-gradient(135deg,#e2e8f0,#94a3b8);border-color:transparent;color:#1a2030}
.place.p3{background:linear-gradient(135deg,#fdba74,#c2410c);border-color:transparent;color:#2a1204}

/* ===== Пустые состояния и тосты ===== */
.empty{text-align:center;padding:30px 18px;border:1px dashed var(--bd2);border-radius:14px;background:linear-gradient(180deg,rgba(var(--ac-rgb),.06),transparent);color:var(--mut)}
.empty .eico{width:46px;height:46px;margin:0 auto 10px;border-radius:12px;display:grid;place-items:center;color:var(--ac2);background:rgba(var(--ac-rgb),.12);border:1px solid rgba(var(--ac-rgb),.3)}
.empty h3{font-family:'Russo One','Exo 2',sans-serif;font-weight:400;color:var(--tx);font-size:16px;margin:0 0 6px}
.empty p{margin:0 auto 12px;max-width:440px;font-size:13px}
.toasts{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100vw - 32px))}
.toast{background:var(--card);border:1px solid var(--bd2);border-left:3px solid var(--ok);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);font-size:13px;animation:rise .2s ease-out both}
.toast.err{border-left-color:var(--bad)}
.toast.out{opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s}
.skels{display:flex;flex-direction:column;gap:12px}
.skel{background:linear-gradient(90deg,var(--in) 25%,var(--in2) 37%,var(--in) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:12px;border:1px solid var(--bd)}
.skel-hero{height:128px}.skel-row{height:60px}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}

/* ===== Чат: пузыри ===== */
.chat{display:flex;flex-direction:column;gap:10px;padding:6px 2px}
.bub{display:flex;align-items:flex-end;gap:8px;max-width:min(78%,640px)}
.bub.me{align-self:flex-end;flex-direction:row-reverse}
.bub .av.sm{width:30px;height:30px;border-radius:50%}
.bub .txt{background:var(--in);border:1px solid var(--bd);border-radius:14px 14px 14px 4px;padding:5px 11px;min-width:0}
.bub.me .txt{background:linear-gradient(135deg,rgba(var(--ac-rgb),.38),rgba(var(--ac-rgb),.14));border-color:rgba(var(--ac-rgb),.42);border-radius:14px 14px 4px 14px}
.bub .who{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut)}
.bub .who b{color:var(--tx);font-size:12px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bub .who .x{margin-left:auto;padding:0 2px;background:transparent;border:0;color:var(--mut);box-shadow:none;transform:none;line-height:1}
.gavatar{background:transparent;border:0;padding:0;line-height:0;cursor:pointer;box-shadow:none;transform:none;filter:none}
.gnick{background:transparent;border:0;padding:0;color:var(--tx);font-size:12px;font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-color:transparent;box-shadow:none;transform:none;filter:none}
.gnick:hover{color:var(--ac2);text-decoration-color:var(--ac2)}
.mention{color:var(--ac2);font-weight:600;background:rgba(var(--ac-rgb),.12);padding:0 3px;border-radius:4px}
.tac-msg-card{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--bd2);border-radius:10px;background:rgba(var(--ac-rgb),.08);min-width:190px}
.tac-msg-card>svg{color:var(--ac2);flex:none}
.tac-msg-card div{display:flex;flex-direction:column;min-width:0}
.tac-msg-card b{font-size:13px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tac-msg-card span{font-size:11px;color:var(--mut)}
.bub .who .x:hover{color:var(--bad)}
.bub p{margin:3px 0 0;white-space:pre-wrap;word-break:break-word;font-size:14px}
.chatform{display:flex;gap:8px;align-items:flex-end;margin-top:12px}
.chatform textarea{min-height:44px;max-height:140px;resize:vertical;flex:1}
.chatform button{flex:none;display:inline-flex;align-items:center;gap:6px}

/* ===== Календарь: чипы событий ===== */
.calgrid{gap:8px}
.calday{display:flex;flex-direction:column;gap:5px;min-height:104px}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.calev{display:flex;flex-direction:column;gap:1px;border-left:3px solid var(--ac);background:var(--in);padding:5px 7px;border-radius:8px;font-size:12px;line-height:1.3}
.calev b{font-size:11px;font-weight:400;color:var(--ac2);font-family:'Russo One','Exo 2',sans-serif;letter-spacing:.4px}
.calev.k-tournament{border-left-color:#f43f5e}.calev.k-brawl{border-left-color:#fbbf24}.calev.k-base{border-left-color:#34d399}.calev.k-other{border-left-color:#60a5fa}
.calev.k-chrono{border-left-color:#a78bfa}.calev.k-airdrop{border-left-color:#facc15}
.sq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.sq-card{padding:10px;border:1px solid var(--sq,var(--bd2));border-top:3px solid var(--sq,var(--ac));border-radius:12px;background:var(--in);min-width:0}
.sq-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.sq-head b{font-size:13px;color:var(--tx)}
.sq-head span{font-size:11px;color:var(--mut)}
.sq-members{display:flex;flex-wrap:wrap;gap:5px}
.sq-members .chip{display:inline-flex;align-items:center;gap:3px;margin:0}
.sq-members .x{padding:0 3px;font-size:14px;line-height:1}
.pg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:18px;margin-bottom:12px;background:linear-gradient(135deg,rgba(var(--ac-rgb),.14),transparent 60%),var(--card);border:1px solid var(--bd2);border-radius:16px}
.pg-head h2{margin:0 0 4px;font-family:'Russo One','Exo 2',sans-serif;font-size:24px;letter-spacing:.5px;text-transform:uppercase}
.pg-head p{margin:0;color:var(--mut);font-size:13px}
.pg-actions,.pg-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pg-actions{justify-content:flex-end}
.pg-actions .ghost,.pg-actions button{min-width:120px;justify-content:center}
.pg-bar{margin-bottom:12px}
.pg-bar .chip{margin:0;cursor:pointer}
.pg-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.pg-kpi{padding:12px 14px;border:1px solid var(--bd2);border-radius:14px;background:var(--card)}
.pg-kpi span{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.pg-kpi b{font-family:'Russo One','Exo 2',sans-serif;font-size:26px;font-weight:400}
.pg-main{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:12px;align-items:start}
.pg-lobby{padding:12px;border:1px dashed var(--bd2);border-radius:14px;background:var(--in)}
.pg-lobby h3{margin:0 0 8px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.12em}
.pg-lobby .lo{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:12px}
.pg-lobby select{flex:1;min-width:0;font-size:11px;padding:4px 6px}
@media(max-width:959px){.pg-kpis{grid-template-columns:1fr 1fr}.pg-main{grid-template-columns:1fr}}
.pg-bar .spacer{flex:1}
.pg-kpis .pg-kpi.b-blue{border-color:#3b82f6;box-shadow:inset 0 0 22px rgba(59,130,246,.08)}
.pg-kpis .pg-kpi.b-green{border-color:#10b981;box-shadow:inset 0 0 22px rgba(16,185,129,.08)}
.pg-kpis .pg-kpi.b-red{border-color:#f43f5e;box-shadow:inset 0 0 22px rgba(244,63,94,.08)}
.pg-kpis .pg-kpi.b-cyan{border-color:#06b6d4;box-shadow:inset 0 0 22px rgba(6,182,212,.08)}
.sq2-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}
@media(max-width:1150px){.sq2-grid{grid-template-columns:1fr}}
.sq2{padding:10px;border:1px solid color-mix(in srgb,var(--sq) 45%,transparent);border-radius:12px;background:linear-gradient(180deg,color-mix(in srgb,var(--sq) 11%,var(--card)),var(--card) 70px);min-width:0;box-shadow:0 0 0 1px color-mix(in srgb,var(--sq) 10%,transparent)}
.sq2-top{display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px solid color-mix(in srgb,var(--sq) 28%,transparent)}
.sq2-ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--sq) 20%,transparent);color:var(--sq);flex:none}
.sq2-name{font-family:'Russo One','Exo 2',sans-serif;font-size:13px;color:var(--sq);text-transform:uppercase;letter-spacing:.4px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sq2-chip{font-size:10px;padding:3px 7px;border-radius:8px;border:1px solid color-mix(in srgb,var(--sq) 45%,transparent);color:var(--sq);font-variant-numeric:tabular-nums;white-space:nowrap}
.sq2-tb{margin-top:6px}
.sq2-row{display:grid;grid-template-columns:minmax(0,1fr) 32px 32px 32px 44px 46px 26px;gap:4px;align-items:center;padding:5px 4px;font-size:11px;border-bottom:1px dashed var(--bd);min-width:0}
.sq2-row[data-drag-pid],.lrow[data-drag-pid]{cursor:grab}
.sq2-row.dragging,.lrow.dragging{opacity:.4}
.sq2.drop-target,.lobby2.drop-target{outline:2px dashed var(--ac);outline-offset:2px;background:var(--g1)}
.sq2-row .ico.x{width:22px;height:22px;min-width:22px;min-height:22px;padding:0;line-height:1}
.sq2-row.th{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--bd2);padding-top:2px;padding-bottom:6px}
.sq2-row>span:not(:first-child){text-align:center;font-variant-numeric:tabular-nums}
.sq2-row .kill{color:var(--ok);text-align:center}
.sq2-row .death{color:var(--bad);text-align:center}
.sq2-row a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sq2-empty{padding:14px 4px;text-align:center;color:var(--mut);font-size:11px}
.sq2-slots{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.sq2-slot{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--bd2);border-radius:8px;font-size:11px;min-height:30px}
.sq2-slot.empty{color:var(--mut);font-style:italic;border-style:dashed}
.sq2-slot.occupied{border-color:color-mix(in srgb,var(--sq) 35%,var(--bd2));background:color-mix(in srgb,var(--sq) 6%,transparent)}
.sq2-drag{color:var(--mut);cursor:grab;font-size:12px;letter-spacing:-2px}
.sq2-acts{display:flex;align-items:center;gap:4px;margin-top:8px;padding-top:6px;border-top:1px dashed var(--bd)}
.ico{border:0;background:transparent;color:var(--mut);cursor:pointer;padding:4px 8px;min-width:34px;min-height:28px;border-radius:6px;line-height:1;font-size:13px}
.ico:hover{background:var(--in);color:var(--tx)}
.ico.bad:hover{color:var(--bad)}
.lobby2{padding:10px;border:1px dashed var(--bd2);border-radius:12px;background:var(--in)}
.lobby2 h3{margin:0 0 8px;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.12em;display:flex;justify-content:space-between}
.lobby2 .lsearch{width:100%;margin-bottom:6px;font-size:11px;padding:6px 8px}
.lobby2 .lrow{padding:5px 7px;border-bottom:1px solid var(--bd);font-size:11px;display:flex;align-items:center;gap:5px;cursor:pointer}
.lobby2 .lrow:hover{background:var(--in2,rgba(255,255,255,.03))}
.sq-new{display:grid;place-items:center;gap:4px;min-height:150px;border:1px dashed var(--bd2);border-radius:12px;color:var(--ac);cursor:pointer;font-size:12px}
.sq-new:hover{border-color:var(--ac);background:rgba(var(--ac-rgb),.05)}
/* Профиль: показатели */
.metric-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media(max-width:959px){.metric-grid{grid-template-columns:1fr}}
.metric-card{padding:12px 14px;border:1px solid var(--bd2);border-radius:14px;background:linear-gradient(135deg,rgba(var(--ac-rgb),.08),transparent 70%),var(--card)}
.metric-card h3{margin:0 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.metric-card .mrow{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;border-bottom:1px dashed var(--bd);font-size:12px}
.metric-card .mrow:last-child{border-bottom:0}
.metric-card .mrow b{font-family:'Russo One','Exo 2',sans-serif;font-weight:400;font-size:16px}
.metric-card .mrow b.kd{color:var(--ok)}.metric-card .mrow b.kda{color:#38bdf8}
.metric-inputs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:959px){.metric-inputs{grid-template-columns:1fr 1fr}}
.metric-in{display:flex;flex-direction:column;gap:5px;padding:11px 12px;border:1px solid var(--bd2);border-radius:12px;background:var(--in)}
.metric-in label{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--mut)}
.metric-in input{width:100%;border:0;background:transparent;padding:0;font-family:'Russo One','Exo 2',sans-serif;font-size:22px;color:var(--tx)}
.metric-in input:focus{outline:none}
.chip .x{padding:0 3px;font-size:14px;line-height:1;margin-left:4px}
.chip .x:hover{color:var(--bad)}
.zone-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.zone-info{padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--in)}
.zone-info h3{margin:0 0 6px;font-size:14px;color:var(--ac2)}
.zone-info p{margin:4px 0;font-size:13px}
.air-row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:13px}
.air-label{flex:none;width:126px;display:flex}
.air-row .chip{display:inline-flex;align-items:center;gap:5px;margin:0;line-height:1.2;white-space:nowrap}
.air-row .chip svg{flex:none}
.zone-form{margin-top:14px;padding-top:12px;border-top:1px solid var(--bd)}
@media(max-width:959px){.zone-grid{grid-template-columns:1fr}}
.calempty{color:var(--bd2);font-size:12px}

/* ===== Тактика: карты и разметка ===== */
.tac-maps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tac-group{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:6px 2px 2px;background:transparent;border:0;color:var(--mut);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;box-shadow:none;transform:none;filter:none;cursor:pointer}
.tac-group:hover{color:var(--ac2);box-shadow:none;transform:none;filter:none}
.tac-group svg{transition:transform .15s ease}
.tac-group[aria-expanded="false"] svg{transform:rotate(-90deg)}
.tac-maps .tac-map[hidden]{display:none}
.tac-online{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-2px 0 10px;font-size:11px}
.tac-who{display:inline-flex;align-items:center;gap:4px;padding:2px 7px 2px 2px;border:1px solid var(--bd);border-radius:999px;background:var(--in)}
.tac-who i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--ac);color:#fff;font-style:normal;font-size:10px;font-weight:700}
.tac-map{display:flex;flex-direction:column;align-items:stretch;gap:0;padding:0;overflow:hidden;background:var(--in);border:1px solid var(--bd);border-radius:12px;text-align:left;color:var(--tx);box-shadow:none;transform:none;font-weight:500;min-width:0}
.tac-map:hover{transform:none;box-shadow:0 0 0 1px var(--bd2);filter:none}
.tac-map img{display:block;width:100%;height:72px;object-fit:cover;opacity:.8;transition:opacity .2s ease}
.tac-map:hover img,.tac-map.on img{opacity:1}
.tac-map.on{border-color:var(--ac);background:rgba(var(--ac-rgb),.12);box-shadow:0 0 0 1px var(--ac),var(--glow)}
.tac-map .nm{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 10px;font-size:13px;line-height:1.25}
.tac-map .nm b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tac-map .nm span{flex:none;font-size:11px;color:var(--mut);font-weight:400}
.tac-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.tac-tool{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 13px;min-height:40px;border-radius:9px;background:var(--in);border:1px solid var(--bd);color:var(--mut);font-weight:600;font-size:13px;box-shadow:none;transform:none;text-decoration:none}
.tac-tool:hover{color:var(--tx);border-color:var(--ac);box-shadow:none;transform:none;filter:none}
.tac-tool.on{color:var(--tx);border-color:var(--ac);background:linear-gradient(180deg,rgba(var(--ac-rgb),.26),rgba(var(--ac-rgb),.1));box-shadow:inset 0 0 0 1px rgba(var(--ac-rgb),.42),0 0 14px rgba(var(--ac-rgb),.16)}
.tac-vtools .tac-tools{display:flex;flex-direction:column;gap:6px}
.tac-vtools .tac-tool{width:100%;justify-content:flex-start;min-height:44px}
.tac-vtools .tac-tool.on{box-shadow:inset 3px 0 0 var(--ac),inset 0 0 0 1px rgba(var(--ac-rgb),.42),0 0 14px rgba(var(--ac-rgb),.16)}
.tac-vtools #tac_gallery_btn{background:linear-gradient(135deg,var(--btn1),var(--btn2));border-color:transparent;color:#fff;font-weight:600}
.tac-vtools #tac_gallery_btn:hover{color:#fff;filter:brightness(1.12);box-shadow:var(--glow)}
.tac-vtools .tac-markbar{flex-direction:column;align-items:stretch;margin:0;padding:8px;gap:6px}
.tac-vtools .tac-sides{display:flex;flex-wrap:wrap}
.tac-sep{width:1px;height:22px;background:var(--bd);margin:0 3px}
.tac-colors{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.tac-color{width:28px;height:28px;min-height:0;padding:0;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px var(--bd2);transform:none}
.tac-color:hover{transform:scale(1.1);box-shadow:0 0 0 1px var(--bd2);filter:none}
.tac-color.on{border-color:var(--card);box-shadow:0 0 0 2px var(--tx),inset 0 0 0 2px rgba(0,0,0,.25)}
.tac-size{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--mut)}
.tac-size input[type=range]{width:92px;padding:0;background:transparent;border:0;box-shadow:none}
.tac-size b{font-family:'Russo One','Exo 2',sans-serif;font-weight:400;font-size:13px;color:var(--tx);min-width:18px;text-align:center}
.tac-stage{position:relative;display:flex;justify-content:center;border:1px solid var(--bd);border-radius:14px;overflow:hidden;background:#080714;touch-action:none}
[data-theme="light"] .tac-stage{background:#e9e6f4}
.tac-fit{position:relative;flex:none;max-width:100%;will-change:transform;transform-origin:50% 50%}
.tac-fit img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none;pointer-events:none}
.tac-fit img[hidden]{display:none}
.tac-fit canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.tac-hint{font-size:12px;color:var(--mut);margin:10px 0 0}
.tac-dlg-fld{display:flex;flex-direction:column;gap:4px;text-align:left;margin:0 0 10px;font-size:12px;color:var(--mut)}
.tac-dlg-fld input,.tac-dlg-fld textarea{width:100%;font-size:14px;color:var(--tx)}
.tac-dlg-fld textarea{min-height:80px;resize:vertical}
.tac-cur{position:absolute;width:14px;height:14px;border:2px solid var(--cc,#fff);border-radius:50% 50% 50% 0;transform:translate(-50%,-50%) rotate(-45deg);pointer-events:none;z-index:4;box-shadow:0 0 10px var(--cc,#fff)}
.tac-cur span{position:absolute;left:10px;top:10px;transform:rotate(45deg);background:var(--cc,#fff);color:#0b1020;font:600 11px sans-serif;padding:2px 6px;border-radius:6px;white-space:nowrap}
.tac-gallery-card{margin-bottom:16px}
.tac-gallery{max-height:190px;overflow-y:auto;scrollbar-width:thin}
.tac-gallery.expanded{max-height:none}
.tac-prev-box .tac-gallery{max-height:55vh}
.tac-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.tac-gitem{display:flex;gap:10px;padding:8px;border:1px solid var(--bd);border-radius:12px;background:var(--in);min-width:0}
.tac-gthumb{width:110px;height:74px;flex:none;border:1px solid var(--bd);border-radius:8px;background:#0b1020;cursor:zoom-in}
.tac-prev-box{width:min(960px,100%);max-height:92vh;overflow:auto;text-align:left}
.tac-prev-host{margin:12px 0;min-height:80px}
.tac-prev-host canvas,.tac-prev-host img{width:100%;height:auto;display:block;border:1px solid var(--bd);border-radius:10px}
.tac-gmeta{min-width:0;display:flex;flex-direction:column;gap:3px;font-size:12px}
.tac-gmeta b{font-size:13px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tac-gmeta span{color:var(--mut);font-size:11px}
.tac-gmeta p{margin:2px 0;color:var(--mut);white-space:pre-wrap;word-break:break-word;max-height:56px;overflow:hidden}
.tac-gact{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.tac-gact .tac-tool{padding:4px 8px;min-height:30px;font-size:11px}
.tac-markbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-2px 0 10px;padding:8px;border:1px solid var(--bd);border-radius:10px;background:var(--in2)}
.tac-markbar[hidden]{display:none}
.tac-capbar{display:flex;gap:6px;align-items:center}
.tac-cap-pill{padding:3px 8px;border:2px solid var(--cs);border-radius:8px;font-size:12px;color:var(--cs);cursor:pointer}
.tac-cap-pill.on{background:var(--cs);color:#0b1020}
.tac-cap-add{margin-left:4px;padding:3px 8px;border:1px dashed var(--bd2);border-radius:8px;font-size:13px;color:var(--ac);cursor:pointer}
.tac-mlab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700}
.tac-stamp svg{opacity:.8}
.tac-stamp.on svg{opacity:1}
.tac-sides{display:inline-flex;gap:4px;padding:2px;border:1px solid var(--bd);border-radius:9px;background:var(--in)}
.tac-side-b{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:4px 10px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--mut);font-size:12px;font-weight:600;box-shadow:none;transform:none}
.tac-side-b:hover{box-shadow:none;transform:none;filter:none;color:var(--tx)}
.tac-side-b i{width:8px;height:8px;border-radius:50%;display:block}
.tac-side-b.on{background:var(--card);border-color:var(--bd2);color:var(--tx)}
.tac-side-b.ally.on{border-color:rgba(47,155,255,.6);box-shadow:inset 0 0 0 1px rgba(47,155,255,.28)}
.tac-side-b.enemy.on{border-color:rgba(255,59,97,.6);box-shadow:inset 0 0 0 1px rgba(255,59,97,.28)}
.tac-zoom{position:absolute;top:10px;right:10px;z-index:2;display:flex;align-items:center;gap:2px;padding:3px;border:1px solid var(--bd);border-radius:10px;background:rgba(11,16,32,.78);backdrop-filter:blur(8px);box-shadow:var(--shadow)}
[data-theme="light"] .tac-zoom{background:rgba(255,255,255,.9)}
.tac-zoom button{min-width:34px;min-height:34px;padding:0 8px;border-radius:7px;background:transparent;border:0;color:var(--tx);font-weight:700;font-size:16px;box-shadow:none;transform:none;line-height:1}
.tac-zoom button:hover{background:rgba(var(--ac-rgb),.18);box-shadow:none;transform:none;filter:none}
.tac-zoom button#tac_zr{font-size:11px;color:var(--mut);padding:0 7px}
.tac-zoom span{min-width:42px;text-align:center;font-size:11px;font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums}
.tac-dlg{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:18px;background:rgba(6,6,18,.62);backdrop-filter:blur(3px);opacity:0;transition:opacity .14s ease}
.tac-dlg.on{opacity:1}
.tac-dlg-box{width:min(420px,100%);background:linear-gradient(180deg,rgba(var(--ac-rgb),.12),transparent 120px),var(--card);border:1px solid var(--bd2);border-radius:16px;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.55);transform:translateY(10px) scale(.97);transition:transform .16s ease;text-align:center}
.tac-dlg.on .tac-dlg-box{transform:none}
.tac-dlg-ico{width:46px;height:46px;margin:0 auto 12px;border-radius:13px;display:grid;place-items:center;color:var(--bad);background:var(--bad-bg);border:1px solid rgba(248,113,113,.35)}
.tac-dlg-box h3{margin:0 0 6px;font-size:17px}
.tac-dlg-box p{margin:0 0 18px;color:var(--mut);font-size:13px;line-height:1.5}
.tac-dlg-act{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tac-dlg-act button{min-width:120px}
button.danger{background:linear-gradient(135deg,#e11d48,#be123c);border-color:rgba(255,255,255,.14)}
button.danger:hover{box-shadow:0 0 18px rgba(225,29,72,.45)}
@media (prefers-reduced-motion:reduce){.tac-dlg,.tac-dlg-box{transition:none}}

/* ===== Мобильная раскладка ===== */
@media (max-width:959px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .mob{display:inline-flex}
  .topbar{padding:10px 14px;gap:8px}
  .tb-kicker{font-size:9px}
  .tb-title h1{font-size:16px}
  .tb-actions .ghost{padding:6px 8px}
  .tb-profile,.tb-theme,.tb-actions .tb-profile,.tb-actions .tb-theme{display:none}
  .tabs{padding:12px 14px 0}
  .content{padding:12px 14px 48px}
  .hero-stats{grid-template-columns:1fr 1fr}
  .podium{grid-template-columns:1fr}
  .bub{max-width:88%}
  .drawer{display:flex;flex-direction:column;gap:8px}
  /* Крупные цели для пальца (HIG: 44pt) */
  .row button,.row input,.row select,.sbar button,.sbar input,.sbar select,.fld input,.fld select,.fld textarea,.chatform button,.tabs button{min-height:44px}
  .tac-maps{grid-template-columns:1fr}
  .tac-map{flex-direction:row;align-items:center}
  .tac-map img{width:88px;height:56px;flex:none}
  .tac-map .nm{flex:1;min-width:0}
  .tac-tool{min-height:44px}
  .tac-work{grid-template-columns:1fr}
  .tac-vtools{position:static}
  .tac-vtools .tac-tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .tac-vtools .tac-markbar{flex-direction:row;flex-wrap:wrap}
  .tac-vtools .tac-tool{width:auto}
  .tac-color{width:40px;height:40px}
  .tac-side-b{min-height:40px;padding:6px 12px}
  .tac-zoom button{min-width:40px;min-height:40px}
  .acsw{width:32px;height:32px}
  .tac-size{width:100%}
  .tac-size input[type=range]{flex:1;width:auto}
  .tb-actions .ghost{min-width:40px;min-height:40px;justify-content:center}
}
/* ===== Чаты: печатают, упоминания, вложения ===== */
.bub{transition:opacity .25s ease,transform .25s ease,max-height .25s ease,margin .25s ease}
.bub.deleting{opacity:0;transform:translateX(18px) scale(.96);max-height:0;overflow:hidden;margin:0;padding:0}
.typing{display:flex;align-items:center;gap:8px;padding:4px 2px 8px;color:var(--mut);font-size:12px;min-height:24px}
.typing .dots{display:inline-flex;gap:3px}
.typing .dots i{width:5px;height:5px;border-radius:50%;background:var(--ac);animation:typingBounce 1.1s infinite ease-in-out}
.typing .dots i:nth-child(2){animation-delay:.15s}.typing .dots i:nth-child(3){animation-delay:.3s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.mention{padding:1px 5px;border:0;border-radius:6px;color:var(--ac2);background:rgba(var(--ac-rgb),.16);font-size:inherit;font-weight:600;cursor:pointer;line-height:inherit;transition:background .15s,color .15s}
.mention:hover{background:rgba(var(--ac-rgb),.32);color:var(--tx);text-decoration:underline}
.mdrop{position:absolute;bottom:calc(100% + 6px);left:0;z-index:20;min-width:210px;max-height:220px;overflow:auto;padding:5px;border:1px solid var(--bd2);border-radius:12px;background:var(--card);box-shadow:var(--shadow)}
.mdrop button{display:block;width:100%;text-align:left;padding:7px 9px;border:0;background:transparent;border-radius:7px;font-size:13px}
.mdrop button:hover,.mdrop button.on{background:rgba(var(--ac-rgb),.16);color:var(--tx)}
.chatform{position:relative;display:flex;gap:8px;align-items:flex-end}
.attach-wrap{position:relative;flex:none}
.attach-btn{width:46px;height:46px;display:grid;place-items:center;border-radius:12px;font-size:24px;line-height:1;padding:0}
.attach-menu{position:absolute;bottom:calc(100% + 8px);left:0;z-index:30;width:320px;max-width:80vw;padding:10px;border:1px solid var(--bd2);border-radius:14px;background:var(--card);box-shadow:var(--shadow)}
.attach-menu h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut)}
.gif-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:10px}
.gif-grid img{width:100%;height:62px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid var(--bd)}
.gif-grid img:hover{border-color:var(--ac)}
.attach-menu .row input{flex:1;min-width:0;font-size:12px}
.tac-list{max-height:190px;overflow:auto;margin-bottom:8px}
.tac-list button{display:block;width:100%;text-align:left;margin-bottom:4px;padding:6px 8px;font-size:12px}
.msg-gif{max-width:260px;border-radius:10px;overflow:hidden;display:block;margin-top:4px}
.msg-gif img{display:block;width:100%}
.msg-tactic{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--ac);border-radius:12px;background:rgba(var(--ac-rgb),.10);margin-top:4px;max-width:270px}
.msg-tactic b{display:block;font-size:13px}.msg-tactic span{font-size:11px;color:var(--mut)}
/* ===== Главная страница ===== */
.land{min-height:100vh;overflow:clip;position:relative;background:radial-gradient(900px 520px at 78% -80px,rgba(var(--ac-rgb),.26),transparent 62%),radial-gradient(700px 460px at -100px 40vh,rgba(244,63,94,.14),transparent 60%),var(--bg)}
.land:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(var(--ac-rgb),.05) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--ac-rgb),.05) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,#000,transparent 70%);pointer-events:none}
.land-nav{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding:14px clamp(18px,5vw,54px);border-bottom:1px solid var(--bd2);background:rgba(var(--bg),.82);backdrop-filter:blur(16px)}
.land-nav .logo{justify-self:start}
.land-nav .land-links{justify-self:center}
.land-nav .lbtns{justify-self:end}
.land-nav .logo{display:flex;align-items:center;gap:10px;font-family:'Russo One',sans-serif;font-size:20px;letter-spacing:.6px;color:var(--tx)}
.land-nav .logo i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--btn1),var(--btn2));box-shadow:var(--glow);font-style:normal}
.land-nav .lbtns{display:flex;gap:8px;flex-wrap:wrap}
.land-hero{position:relative;max-width:1180px;margin:0 auto;padding:clamp(48px,8vw,96px) clamp(18px,5vw,54px) 40px;text-align:center}
.land-hero .kick{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border:1px solid rgba(var(--ac-rgb),.45);border-radius:999px;background:rgba(var(--ac-rgb),.1);color:var(--ac2);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.land-hero h1{margin:18px 0 14px;font-size:clamp(38px,6.5vw,76px);line-height:1.02;letter-spacing:-1px;text-transform:uppercase;text-shadow:0 0 38px rgba(var(--ac-rgb),.28)}
.land-hero h1 em{font-style:normal;color:var(--ac2)}
.land-hero p{max-width:690px;margin:0 auto;font-size:clamp(15px,2vw,19px);color:var(--mut)}
.land-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.land-cta button{padding:14px 26px;font-size:16px;border-radius:12px}
.land-cta .sec{background:transparent;border-color:var(--bd2);color:var(--tx)}
.theme-panel{position:absolute;top:64px;right:clamp(18px,5vw,54px);z-index:40;width:290px;padding:14px;border:1px solid var(--bd2);border-radius:16px;background:var(--card);box-shadow:var(--shadow);animation:rise .2s ease-out}
.theme-panel[hidden]{display:none}
.theme-panel h4{margin:0 0 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.tp-swatches{display:flex;gap:8px;margin-bottom:14px}
.tp-sw{width:38px;height:38px;border-radius:11px;border:2px solid transparent;cursor:pointer;position:relative;transition:transform .15s,border-color .15s}
.tp-sw:hover{transform:translateY(-2px)}.tp-sw.on{border-color:var(--tx)}
.tp-sw.custom{background:conic-gradient(#f43f5e,#f59e0b,#10b981,#3b82f6,#8b5cf6,#f43f5e)}
.tp-custom{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.tp-custom input[type=color]{width:40px;height:38px;padding:2px;border:1px solid var(--bd);border-radius:9px;background:var(--in);cursor:pointer}
.tp-custom input[type=text]{flex:1;min-width:0;font-family:monospace;font-size:13px}
.tp-custom button{padding:8px 10px;font-size:12px}
.tp-theme{width:100%;font-size:12px}
.day-picks{display:flex;gap:5px;flex-wrap:wrap}
.day-picks[hidden]{display:none}
.day-picks button{width:34px;height:34px;padding:0;border-radius:9px;font-size:12px;background:transparent;border-color:var(--bd);color:var(--mut)}
.day-picks button:hover{border-color:var(--ac);color:var(--tx);box-shadow:none;transform:none}
.day-picks button.on{background:linear-gradient(135deg,var(--btn1),var(--btn2));color:#fff;border-color:transparent}
.next-date{margin:8px 0 0!important;font-size:12px;color:var(--ac2)}
.land-stats{display:flex;justify-content:center;gap:clamp(18px,5vw,60px);flex-wrap:wrap;margin-top:46px}
.land-stats div{min-width:110px}.land-stats b{display:block;font-family:'Russo One',sans-serif;font-size:clamp(26px,4vw,40px);color:var(--ac2)}
.land-stats span{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut)}
.land-sec{position:relative;max-width:1180px;margin:0 auto;padding:44px clamp(18px,5vw,54px)}
.land-sec>h2{text-align:center;font-size:clamp(26px,4vw,42px);text-transform:uppercase;margin-bottom:8px}
.land-sec>.sub{text-align:center;color:var(--mut);margin-bottom:30px}
.land-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.land-card{padding:22px;border:1px solid var(--bd2);border-radius:18px;background:linear-gradient(160deg,rgba(var(--ac-rgb),.10),transparent 60%),var(--card);transition:transform .25s,border-color .25s,box-shadow .25s}
.land-card:hover{transform:translateY(-5px);border-color:var(--ac);box-shadow:var(--glow)}
.land-card .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(var(--ac-rgb),.14);color:var(--ac2);margin-bottom:14px}
.land-card h3{margin:0 0 8px;font-size:18px}.land-card p{margin:0;color:var(--mut);font-size:14px}
.land-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.land-step{padding:20px;border-left:3px solid var(--ac);border-radius:0 14px 14px 0;background:var(--card)}
.land-step b{display:block;color:var(--ac2);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.land-foot{text-align:center;padding:36px 18px 46px;color:var(--mut);border-top:1px solid var(--bd2)}
.land-aurora{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.land-aurora i{position:absolute;display:block;border-radius:50%;filter:blur(80px);opacity:.28;animation:aurora 18s ease-in-out infinite alternate}
.land-aurora i:nth-child(1){width:46vw;height:46vw;left:-12vw;top:-14vw;background:var(--ac)}
.land-aurora i:nth-child(2){width:38vw;height:38vw;right:-10vw;top:18vh;background:#f43f5e;animation-delay:-6s}
.land-aurora i:nth-child(3){width:32vw;height:32vw;left:32vw;bottom:-14vw;background:var(--ac2);animation-delay:-12s}
@keyframes aurora{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(6vw,5vh,0) scale(1.18)}}
.land-bento{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:46px;position:relative;z-index:1}
.land-bento .bs{padding:15px 14px;border:1px solid var(--bd2);border-radius:14px;background:linear-gradient(160deg,rgba(var(--ac-rgb),.12),transparent 65%),var(--card);text-align:left;transition:transform .2s,border-color .2s}
.land-bento .bs:hover{transform:translateY(-4px);border-color:var(--ac)}
.land-bento .bs .ic{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:rgba(var(--ac-rgb),.16);color:var(--ac2);margin-bottom:8px}
.land-bento .bs b{display:block;font-family:'Russo One',sans-serif;font-size:clamp(21px,3vw,32px);color:var(--ac2);line-height:1}
.land-bento .bs>span:last-of-type{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut)}
.land-bento .bar{height:3px;border-radius:3px;background:rgba(var(--ac-rgb),.18);margin-top:10px;overflow:hidden}
.land-bento .bar i{display:block;height:100%;width:0;border-radius:3px;background:var(--ac2);transition:width .9s cubic-bezier(.2,.8,.2,1)}
@media(max-width:900px){.land-bento{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.land-bento{grid-template-columns:repeat(2,1fr)}}
/* Глубокая проработка главной */
.land-links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.nav-links{flex-wrap:nowrap;gap:5px}
.nav-links a{font-size:12px;padding:8px 10px;border-radius:9px;gap:5px}
.nav-links a:before{width:5px;height:5px}
.land-cta-sec.top{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:42px clamp(18px,5vw,54px);border-top:1px solid var(--bd2);border-bottom:0}
.land-cta-sec.top h2{font-size:clamp(24px,3.4vw,38px);margin:0 0 6px}
.land-cta-sec.top .cta-ring{width:420px;height:420px;margin:-210px 0 0 -210px}
.land-links a{display:inline-flex;align-items:center;gap:8px;padding:13px 20px;border:1px solid var(--bd2);border-radius:12px;color:var(--tx);font-size:15px;font-weight:600;text-decoration:none;letter-spacing:.2px;white-space:nowrap;background:rgba(var(--card),.7);transition:color .2s,background .2s,border-color .2s,transform .2s,box-shadow .2s}
.land-links a:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ac2);opacity:.8;transition:opacity .2s,transform .2s}
.land-links a:hover{color:var(--tx);border-color:var(--ac);background:rgba(var(--ac-rgb),.12);transform:translateY(-2px);box-shadow:0 6px 18px rgba(var(--ac-rgb),.15)}
.land-links a:hover:before{opacity:1;transform:scale(1.35)}
.land-links a.on{color:var(--ac2);border-color:var(--ac);background:rgba(var(--ac-rgb),.18);box-shadow:inset 0 0 0 1px rgba(var(--ac-rgb),.35)}
.land-links a.on:before{opacity:1;box-shadow:0 0 12px var(--ac2)}
@media(max-width:700px){.land-links a{font-size:13px;padding:10px 13px}}
.sec-kicker{display:inline-block;margin-bottom:10px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ac2);font-weight:700}
.land-sec{position:relative}
.land-sec:before{content:"";position:absolute;left:clamp(18px,5vw,54px);right:clamp(18px,5vw,54px);top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--ac-rgb),.45),transparent)}
.land-decor{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.land-decor .dc{position:absolute;color:rgba(var(--ac-rgb),.16)}
.land-decor .d1{width:320px;height:320px;top:120px;right:-90px;animation:spin 90s linear infinite}
.land-decor .d2{width:260px;height:260px;top:900px;left:-100px;animation:spin 120s linear infinite reverse}
.land-decor .d3{width:420px;height:130px;top:1900px;right:-60px;opacity:.5}
.land-decor .d4{position:absolute;width:380px;height:380px;border-radius:50%;border:1px dashed rgba(var(--ac-rgb),.18);bottom:600px;left:45%}
.land-decor .d5{position:absolute;inset:0;background-image:repeating-linear-gradient(115deg,transparent 0 58px,rgba(var(--ac-rgb),.035) 59px 60px);mask-image:linear-gradient(to bottom,transparent,#000 30%,transparent 85%)}
@keyframes spin{to{transform:rotate(360deg)}}
.land-card-n{position:absolute;top:12px;right:14px;font-family:'Russo One',sans-serif;font-size:30px;color:rgba(var(--ac-rgb),.16);line-height:1}
.land-card{position:relative;overflow:hidden}
.card-glow{position:absolute;width:120px;height:120px;border-radius:50%;background:var(--ac);filter:blur(60px);opacity:.10;right:-40px;bottom:-50px;pointer-events:none}
.spark-wrap{display:flex;align-items:flex-end;gap:10px;margin-top:14px;color:var(--ac2)}
.spark{width:96px;height:30px;flex:none}
.spark-wrap .mut{font-size:10px}
.land-flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;position:relative}
.land-flow:before{content:"";position:absolute;left:8%;right:8%;top:34px;height:2px;background:linear-gradient(90deg,var(--ac),rgba(var(--ac-rgb),.15))}
.land-step.flow{position:relative;border:1px solid var(--bd2);border-radius:16px;text-align:center;padding-top:18px;z-index:1}
.flow-n{display:grid;place-items:center;width:34px;height:34px;margin:0 auto 12px;border-radius:50%;background:var(--ac);color:#fff;font-family:'Russo One',sans-serif;font-size:13px;box-shadow:var(--glow)}
.land-step.flow h3{margin:0 0 6px;font-size:16px;font-family:'Russo One',sans-serif}
.land-step.flow p{margin:0;color:var(--mut);font-size:12px}
.hook-title{max-width:920px;margin:0 auto 10px!important;font-size:clamp(24px,4vw,46px)!important;line-height:1.2}
.hook-title em{font-style:normal;color:var(--ac2)}
.land-steps .land-step{position:relative;padding-left:44px}
.step-n{position:absolute;left:14px;top:20px;font-family:'Russo One',sans-serif;font-size:12px;color:var(--ac2)}
.land-cta-sec{position:relative;overflow:hidden;text-align:center;padding:80px clamp(18px,5vw,54px);border-top:1px solid var(--bd2)}
.cta-ring{position:absolute;left:50%;top:50%;width:560px;height:560px;margin:-280px 0 0 -280px;border:1px solid rgba(var(--ac-rgb),.22);border-radius:50%;box-shadow:0 0 0 60px rgba(var(--ac-rgb),.03),0 0 0 130px rgba(var(--ac-rgb),.02);pointer-events:none}
.scroll-hint{display:flex;flex-direction:column;align-items:center;gap:3px;margin-top:34px;color:var(--mut);font-size:10px;letter-spacing:.16em;text-transform:uppercase;position:relative;z-index:1}
.scroll-hint i{font-style:normal;font-size:20px;color:var(--ac2);animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
@media(max-width:900px){
  .land-flow{grid-template-columns:repeat(2,1fr)}.land-flow:before{display:none}
  .land-nav{grid-template-columns:minmax(0,1fr) auto;row-gap:10px}
  .land-nav .land-links{grid-column:1/-1;grid-row:2;justify-self:center;flex-wrap:wrap}
  .land-hero{padding-top:44px}
}
@media(max-width:560px){
  .land-nav{padding:10px 14px}
  .land-nav .logo span{font-size:16px}
  .land-nav .lbtns button{font-size:12px;padding:7px 9px}
  .land-links a{font-size:11px;padding:7px 9px;gap:4px}
  .land-bento{grid-template-columns:repeat(2,1fr);gap:8px}
  .land-cta-sec.top{padding:30px 16px}
  .chatform{gap:6px}.attach-btn{width:42px;height:42px}
  .tb-actions .ghost{padding:6px 7px}
}
@media(max-width:600px){.land-flow{grid-template-columns:1fr}.land-nav .lbtns button{font-size:13px;padding:8px 10px}}
@media(prefers-reduced-motion:reduce){.land-aurora i,.land-decor .dc,.scroll-hint i{animation:none}}
@media(prefers-reduced-motion:reduce){.land-aurora i{animation:none}}
@media(prefers-reduced-motion:reduce){.typing .dots i,.land-card,.bub{animation:none!important;transition:none!important}}
/* ===== Экран загрузки ===== */
.boot{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;overflow:hidden;background:radial-gradient(700px 480px at 50% -10%,rgba(var(--ac-rgb),.22),transparent 65%),var(--bg)}
.boot:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(var(--ac-rgb),.05) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--ac-rgb),.05) 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(circle at 50% 45%,#000,transparent 70%)}
.boot-orb{position:absolute;width:420px;height:420px;border:1px solid rgba(var(--ac-rgb),.22);border-radius:50%;animation:bootSpin 14s linear infinite}
.boot-orb:nth-child(2){width:300px;height:300px;border-style:dashed;border-color:rgba(var(--ac-rgb),.3);animation-direction:reverse;animation-duration:9s}
@keyframes bootSpin{to{transform:rotate(360deg)}}
.boot-logo{position:relative;display:flex;align-items:center;gap:12px;font-family:'Russo One',sans-serif;font-size:clamp(26px,5vw,40px);letter-spacing:.6px}
.boot-logo svg{width:46px;height:46px;padding:9px;border-radius:14px;background:linear-gradient(135deg,var(--btn1),var(--btn2));box-shadow:var(--glow);animation:bootPulse 1.6s ease-in-out infinite}
.boot-logo em{font-style:normal;color:var(--ac2)}
@keyframes bootPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.boot-sub{position:relative;color:var(--mut);font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.boot-bar{position:relative;width:min(320px,70vw);height:4px;border-radius:4px;background:rgba(var(--ac-rgb),.16);overflow:hidden}
.boot-bar i{display:block;height:100%;width:35%;border-radius:4px;background:linear-gradient(90deg,transparent,var(--ac2),transparent);animation:bootLoad 1.5s ease-in-out infinite}
@keyframes bootLoad{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
.boot-dots{position:relative;display:flex;gap:6px;margin-top:-8px}
.boot-dots i{width:7px;height:7px;border-radius:50%;background:var(--ac2);animation:typingBounce 1.1s infinite ease-in-out}
.boot-dots i:nth-child(2){animation-delay:.15s}.boot-dots i:nth-child(3){animation-delay:.3s}
@media(prefers-reduced-motion:reduce){.boot-orb,.boot-logo svg,.boot-bar i,.boot-dots i{animation:none}}
/* ============ Марио-стиль: фон-частицы на стартовой ============ */
#tacTip{position:absolute;display:none;pointer-events:none;z-index:20;background:var(--card);border:1px solid var(--bd2);border-radius:9px;padding:4px 9px;font-size:11px;font-weight:600;color:var(--tx);white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.5);letter-spacing:.5px}
#posStrip{position:fixed;left:14px;bottom:14px;z-index:2;padding:6px 10px;border-radius:9px;background:var(--card);font-size:11px;color:var(--mut);max-width:90%;opacity:.95;pointer-events:none}
.strip-icon{width:16px;height:16px}
.strip-tile{display:flex;align-items:center;gap:4px;color:var(--ac2);font-size:11px}
/* Максимальный текст — это просто увеличенный шрифт в заголовках и таблицах */
:root[data-max="1"] main,:root[data-max="1"] .card,:root[data-max="1"] table th,:root[data-max="1"] table td,:root[data-max="1"] .hstat b,:root[data-max="1"] .tb-title h1,:root[data-max="1"] .dh-top h1{font-size:1.45em!important}
.role-badge{display:inline-flex;align-items:center;gap:4px;margin:0 0 3px 8px;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.06em;vertical-align:middle;border:1px solid var(--bd2);color:var(--mut);background:var(--in)}
.role-badge.owner{color:var(--warn);border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.12)}
.role-badge.officer{color:var(--ac2);border-color:rgba(var(--ac-rgb),.45);background:var(--g1)}
.role-badge svg{width:11px;height:11px;flex:none}
/* ===== Дашборд клана (плитки) ===== */
.db-head{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.db-brand{display:flex;gap:12px;align-items:center}
.db-logo{width:46px;height:46px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:var(--glow);flex:none}
.db-head h2{margin:0;font-size:22px}
.db-head p{margin:2px 0 0;font-size:12px;color:var(--mut)}
.db-ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.db-seg{display:inline-flex;padding:3px;border:1px solid var(--bd);border-radius:10px;background:var(--in)}
.db-seg button{border:0;background:transparent;color:var(--mut);padding:6px 12px;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:.08em;cursor:pointer}
.db-seg button.on{background:var(--ac);color:#fff}
.db-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.db-kpi{padding:13px 15px;border:1px solid var(--bd2);border-radius:13px;background:var(--card);position:relative;overflow:hidden}
.db-kpi:after{content:"";position:absolute;inset:auto 0 0 0;height:2px;background:var(--ac);opacity:.6}
.db-kpi.g:after{background:var(--ok)}.db-kpi.r:after{background:var(--bad)}.db-kpi.y:after{background:var(--warn)}
.db-kpi span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.db-kpi b{display:block;font:400 26px/1.25 'Russo One',sans-serif;margin-top:3px}
.db-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,1fr);gap:14px;margin-bottom:14px}
.db-card{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:16px}
.db-card h3{font:400 14px 'Russo One',sans-serif;letter-spacing:.06em;margin:0 0 3px;display:flex;align-items:center;gap:8px}
.db-card .sub{color:var(--mut);font-size:11px;margin:0 0 12px}
.db-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.db-link{border:0;background:transparent;color:var(--ac2);font-size:11px;font-weight:700;cursor:pointer;padding:4px;white-space:nowrap}
.db-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.db-tabs button{border:1px solid var(--bd);border-radius:999px;background:transparent;color:var(--mut);font-size:10px;font-weight:700;padding:4px 10px;cursor:pointer}
.db-tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.db-player,.db-squad{display:flex;align-items:center;gap:10px;padding:8px 4px;border-top:1px solid var(--bd)}
.db-player:first-child,.db-squad:first-child{border-top:0}
.db-rank{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--in);color:var(--mut);flex:none}
.db-rank.p1{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#241700}.db-rank.p2{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#111827}.db-rank.p3{background:linear-gradient(135deg,#f59e0b,#b45309);color:#1a1000}
.db-who{flex:1;min-width:0}
.db-who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.db-who small{color:var(--mut);font-size:11px}
.db-kd{font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.db-kd .k{color:var(--ok)}.db-kd .d{color:var(--bad)}.db-kd .a{color:var(--ac2)}
.db-metrics{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.db-metric{border:1px solid var(--bd);border-radius:8px;padding:3px 7px;background:var(--in);font-size:10px;color:var(--mut);white-space:nowrap}
.db-metric b{color:var(--tx);font-size:11px;margin-left:3px}
.db-metric.hot{border-color:var(--warn);color:var(--warn)}
.db-sq-n{font:400 13px 'Russo One',sans-serif;color:var(--ac2)}
.db-ach{display:flex;align-items:center;gap:9px;padding:9px;border-radius:10px;background:var(--in);margin-bottom:7px;border:1px solid var(--bd)}
.db-ach b{display:block;font-size:12px}.db-ach small{color:var(--mut);font-size:11px}
.db-ach .val{margin-left:auto;text-align:right;color:var(--warn);font:400 15px 'Russo One',sans-serif}
.db-ach .val small{display:block;color:var(--mut);font:400 10px 'Exo 2',sans-serif}
.db-match-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mcard{border:1px solid var(--bd2);border-radius:14px;padding:13px;background:linear-gradient(160deg,rgba(var(--ac-rgb),.08),transparent 50%),var(--in)}
.mcard.win{border-color:rgba(52,211,153,.5)}.mcard.loss{border-color:rgba(248,113,113,.45)}
.mcard-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.mres{font-size:10px;font-weight:800;letter-spacing:.1em;padding:3px 8px;border-radius:999px}
.mcard.win .mres{background:rgba(52,211,153,.16);color:var(--ok)}.mcard.loss .mres{background:var(--bad-bg);color:var(--bad)}
.mdate{font-size:10px;color:var(--mut)}
.mopp{font-size:14px;font-weight:700;margin:9px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mlabel{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.mscore{font:400 24px 'Russo One',sans-serif;margin:1px 0 8px}
.mscore.win{color:var(--ok)}.mscore.loss{color:var(--bad)}
.mchips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:9px}
.mchips span{border:1px solid var(--bd);border-radius:999px;padding:2px 8px;font-size:10px;color:var(--mut)}
.mstat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;border-top:1px solid var(--bd);padding-top:8px;text-align:center}
.mstat div{font-size:9px;color:var(--mut)}.mstat b{display:block;font-size:12px;color:var(--tx)}
.db-pager{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;font-size:11px;color:var(--mut)}
.db-pager button{border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:9px;padding:6px 12px;cursor:pointer;font-size:11px}
.db-layout-side .db-grid,.db-layout-side .db-match-grid{grid-template-columns:1fr}

      x.classList.toggle('on', on);

    });
  });
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { toggle(false); tab = b.dataset.t; again(); });
  app.querySelectorAll('[data-home]').forEach(b => b.onclick = () => { toggle(false); showLanding(); });
  app.querySelectorAll('[data-sfx-toggle]').forEach(b => b.onclick = () => {
    sfxOn = !sfxOn; localStorage.setItem(SFX_KEY, sfxOn ? '1' : '0');

  });

    const go = () => { toggle(false); tab = 'clan'; render(); };
    b.onclick = go;
    b.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
  });
  views[tab]();
}

const F0 = { q: '', tier: '', tpw: '', faction: '', goal: '', bpw: '', gear: '', kd: '', ehp: '', speed: '', nomic: false, verified: false, slots: false, sort: 'tier' };

const fitList = (c, p, who) => {

  if (c.min_speed) r.push([p.speed != null && Number(p.speed) >= Number(c.min_speed), `Скорость от ${c.min_speed} (${who}: ${p.speed ?? '—'})`]);
  if (c.needs_mic) r.push([!!p.mic, `Нужен микрофон (${who}: ${p.mic ? 'есть' : 'нет'})`]);

const CHAT_GIFS = [
  { t: 'Огонь', u: 'stickers/fire.svg' },
  { t: 'Танцы', u: 'stickers/dance.svg' },
  { t: 'Окей', u: 'stickers/ok.svg' },
